name: CI

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff format --check skitter/ tests/
      - run: uvx ruff check skitter/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run python -m pytest tests/test_unit.py -q

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: docker compose up -d --wait
      - run: uv run python -m pytest tests/test_e2e.py -v
      - if: always()
        run: docker compose down
