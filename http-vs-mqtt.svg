<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dg" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4" fill="#bbb"/></marker>
    <marker id="ug" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto"><path d="M6,0 L0,2 L6,4" fill="#bbb"/></marker>
    <marker id="db" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4" fill="#3b82f6"/></marker>
    <marker id="ub" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto"><path d="M6,0 L0,2 L6,4" fill="#3b82f6"/></marker>
  </defs>

  <rect width="960" height="420" fill="#fff"/>

  <!-- Titles -->
  <text x="230" y="26" font-size="12" font-weight="700" fill="#aaa" text-anchor="middle" letter-spacing="2">HTTP</text>
  <text x="730" y="26" font-size="12" font-weight="700" fill="#aaa" text-anchor="middle" letter-spacing="2">MQTT</text>

  <!-- Divider -->
  <line x1="480" y1="10" x2="480" y2="410" stroke="#e5e7eb" stroke-dasharray="4,4"/>


  <!-- ===================== LEFT: HTTP ===================== -->

  <!-- Orchestrator outer box (tall — carries everything) -->
  <rect x="60" y="42" width="340" height="214" rx="12" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="230" y="64" font-size="11" font-weight="600" fill="#888" text-anchor="middle" letter-spacing="0.8">ORCHESTRATOR</text>

  <!-- Green zone: AI reasoning -->
  <rect x="76" y="76" width="308" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="230" y="105" font-size="12" fill="#065f46" text-anchor="middle" font-weight="500">Reason about task</text>

  <!-- Red infrastructure pills — 2 columns × 3 rows -->
  <rect x="76"  y="142" width="148" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="150" y="161" font-size="10.5" fill="#991b1b" text-anchor="middle">route</text>

  <rect x="236" y="142" width="148" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="310" y="161" font-size="10.5" fill="#991b1b" text-anchor="middle">discover</text>

  <rect x="76"  y="178" width="148" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="150" y="197" font-size="10.5" fill="#991b1b" text-anchor="middle">queue</text>

  <rect x="236" y="178" width="148" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="310" y="197" font-size="10.5" fill="#991b1b" text-anchor="middle">retry</text>

  <rect x="76"  y="214" width="148" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="150" y="233" font-size="10.5" fill="#991b1b" text-anchor="middle">balance</text>

  <rect x="236" y="214" width="148" height="28" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="310" y="233" font-size="10.5" fill="#991b1b" text-anchor="middle">fan-out</text>

  <!-- Side annotation -->
  <text x="414" y="100" font-size="9" fill="#10b981" font-style="italic">AI</text>
  <text x="414" y="192" font-size="9" fill="#dc2626" font-style="italic">plumbing</text>

  <!-- Bidirectional arrows to agents -->
  <line x1="150" y1="256" x2="150" y2="342" stroke="#bbb" stroke-width="1.2" marker-start="url(#ug)" marker-end="url(#dg)"/>
  <line x1="230" y1="256" x2="230" y2="342" stroke="#bbb" stroke-width="1.2" marker-start="url(#ug)" marker-end="url(#dg)"/>
  <line x1="310" y1="256" x2="310" y2="342" stroke="#bbb" stroke-width="1.2" marker-start="url(#ug)" marker-end="url(#dg)"/>


  <!-- Agent circles -->
  <circle cx="150" cy="362" r="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="150" y="367" font-size="11" fill="#888" text-anchor="middle">A</text>
  <circle cx="230" cy="362" r="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="230" y="367" font-size="11" fill="#888" text-anchor="middle">B</text>
  <circle cx="310" cy="362" r="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="310" y="367" font-size="11" fill="#888" text-anchor="middle">C</text>


  <!-- ===================== RIGHT: MQTT ===================== -->

  <!-- Orchestrator box (short — just thinks) -->
  <rect x="560" y="42" width="340" height="94" rx="12" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
  <text x="730" y="64" font-size="11" font-weight="600" fill="#888" text-anchor="middle" letter-spacing="0.8">ORCHESTRATOR</text>

  <!-- Green zone: AI reasoning (identical to left) -->
  <rect x="576" y="76" width="308" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="730" y="105" font-size="12" fill="#065f46" text-anchor="middle" font-weight="500">Reason about task</text>

  <!-- Side annotation -->
  <text x="914" y="100" font-size="9" fill="#10b981" font-style="italic">AI</text>

  <!-- Arrow orchestrator → broker -->
  <line x1="730" y1="136" x2="730" y2="158" stroke="#3b82f6" stroke-width="1.2" marker-start="url(#ub)" marker-end="url(#db)"/>

  <!-- Broker box -->
  <rect x="560" y="158" width="340" height="148" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="730" y="180" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle" letter-spacing="0.8">MQTT BROKER</text>

  <!-- Blue infrastructure pills — same 6 items, now in the broker -->
  <rect x="576" y="192" width="148" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="650" y="211" font-size="10.5" fill="#1e40af" text-anchor="middle">route</text>

  <rect x="736" y="192" width="148" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="810" y="211" font-size="10.5" fill="#1e40af" text-anchor="middle">discover</text>

  <rect x="576" y="228" width="148" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="650" y="247" font-size="10.5" fill="#1e40af" text-anchor="middle">queue</text>

  <rect x="736" y="228" width="148" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="810" y="247" font-size="10.5" fill="#1e40af" text-anchor="middle">retry</text>

  <rect x="576" y="264" width="148" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="650" y="283" font-size="10.5" fill="#1e40af" text-anchor="middle">balance</text>

  <rect x="736" y="264" width="148" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="810" y="283" font-size="10.5" fill="#1e40af" text-anchor="middle">fan-out</text>

  <!-- Side annotation -->
  <text x="914" y="242" font-size="9" fill="#3b82f6" font-style="italic">infra</text>

  <!-- Bidirectional arrows to agents -->
  <line x1="650" y1="306" x2="650" y2="342" stroke="#3b82f6" stroke-width="1.2" marker-start="url(#ub)" marker-end="url(#db)"/>
  <line x1="730" y1="306" x2="730" y2="342" stroke="#3b82f6" stroke-width="1.2" marker-start="url(#ub)" marker-end="url(#db)"/>
  <line x1="810" y1="306" x2="810" y2="342" stroke="#3b82f6" stroke-width="1.2" marker-start="url(#ub)" marker-end="url(#db)"/>


  <!-- Agent circles -->
  <circle cx="650" cy="362" r="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="650" y="367" font-size="11" fill="#888" text-anchor="middle">A</text>
  <circle cx="730" cy="362" r="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="730" y="367" font-size="11" fill="#888" text-anchor="middle">B</text>
  <circle cx="810" cy="362" r="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="810" y="367" font-size="11" fill="#888" text-anchor="middle">C</text>
</svg>