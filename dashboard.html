<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #fafaf9;
      --bg-card: #ffffff;
      --bg-sidebar: #f5f5f4;
      --bg-hover: #edeceb;
      --border: #d6d3d1;
      --border-light: #e7e5e4;
      --text: #1c1917;
      --text-sec: #57534e;
      --text-dim: #a8a29e;
      --blue: #2563eb;
      --green: #15803d;
      --amber: #b45309;
      --red: #b91c1c;
      --blue-bg: #eff6ff;
      --green-bg: #f0fdf4;
      --amber-bg: #fffbeb;
      --red-bg: #fef2f2;
      --sans: 'Outfit', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', 'SF Mono', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--sans); font-size: 13px; color: var(--text); background: var(--bg); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Layout */
    #app { display: flex; flex-direction: column; height: 100vh; }
    #header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-card); flex-shrink: 0; }
    #body { display: flex; flex: 1; overflow: hidden; }
    #sidebar { width: 240px; min-width: 240px; border-right: 1px solid var(--border); background: var(--bg-sidebar); display: flex; flex-direction: column; overflow: hidden; }
    #main { flex: 1; overflow-y: auto; padding: 16px; }

    /* Header */
    .hdr-title { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .hdr-org { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
    .hdr-spacer { flex: 1; }
    .hdr-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-sec); }
    .hdr-status + .hdr-status { margin-left: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-off { background: var(--red); }
    .dot-on { background: var(--green); }
    .dot-pulse { background: var(--blue); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .hdr-btn { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; font-size: 11px; font-family: var(--sans); color: var(--text-sec); cursor: pointer; }
    .hdr-btn:hover { background: var(--bg-hover); color: var(--text); }

    /* Sidebar */
    .side-section { border-bottom: 1px solid var(--border-light); }
    .side-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }
    .side-hdr { padding: 10px 14px 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }
    .side-empty { padding: 12px 14px; font-size: 11px; color: var(--text-dim); }

    /* Agent/App items */
    .side-item { padding: 7px 14px; cursor: default; transition: background .1s; }
    .side-item:hover { background: var(--bg-hover); }
    .side-item-name { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
    .side-item-name .dot { width: 6px; height: 6px; }
    .side-item-desc { font-size: 11px; color: var(--text-dim); margin-top: 1px; padding-left: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side-item-detail { display: none; padding: 6px 14px 8px 26px; font-size: 10px; color: var(--text-sec); line-height: 1.6; }
    .side-item-detail .detail-row { display: flex; gap: 6px; }
    .side-item-detail .detail-label { color: var(--text-dim); min-width: 60px; font-family: var(--mono); }
    .side-item.expanded .side-item-detail { display: block; }
    .side-item-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; padding-left: 12px; }
    .tag { font-size: 10px; font-family: var(--mono); padding: 1px 5px; border-radius: 3px; background: var(--bg-hover); color: var(--text-sec); }

    /* Sessions */
    .sessions-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); gap: 4px; text-align: center; padding: 40px; }
    .sessions-empty-title { font-size: 14px; font-weight: 500; }
    .sessions-empty-hint { font-size: 12px; }

    .session-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; transition: opacity .2s; }
    .session-card.terminal { opacity: 0.65; }
    .session-card.terminal:hover { opacity: 1; }
    .session-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .session-app { font-size: 13px; font-weight: 600; }
    .session-id { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
    .session-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 3px; }
    .session-badge.running { background: var(--blue-bg); color: var(--blue); }
    .session-badge.completed { background: var(--green-bg); color: var(--green); }
    .session-badge.failed { background: var(--red-bg); color: var(--red); }
    .session-time { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-left: auto; }
    .session-error { font-size: 11px; color: var(--red); margin-top: 6px; padding: 6px 8px; background: var(--red-bg); border-radius: 3px; }

    /* DAG */
    .dag { display: flex; align-items: stretch; gap: 0; padding: 4px 0; overflow-x: auto; }
    .dag-level { display: flex; flex-direction: column; gap: 6px; }
    .dag-arrow { display: flex; align-items: center; padding: 0 8px; color: var(--border); font-size: 16px; flex-shrink: 0; user-select: none; }
    .dag-task { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border-light); border-radius: 4px; font-size: 11px; white-space: nowrap; background: var(--bg); transition: border-color .15s; position: relative; }
    .dag-task:hover { border-color: var(--border); }
    .dag-task .dot { width: 6px; height: 6px; }
    .dag-task-id { font-weight: 500; }
    .dag-task-agent { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
    .dag-task.failed { border-color: var(--red); background: var(--red-bg); }
    .dag-task-error { position: absolute; top: 100%; left: 0; right: 0; margin-top: 2px; font-size: 10px; color: var(--red); padding: 2px 6px; background: var(--red-bg); border-radius: 2px; white-space: normal; max-width: 200px; z-index: 1; display: none; }
    .dag-task.failed:hover .dag-task-error { display: block; }
    .dag-task-tooltip { display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 4px; font-size: 10px; color: var(--text-sec); background: var(--bg-card); border: 1px solid var(--border); border-radius: 3px; padding: 4px 8px; white-space: normal; max-width: 250px; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .dag-task:hover .dag-task-tooltip { display: block; }

    /* No-graph fallback */
    .session-minimal { font-size: 12px; color: var(--text-sec); padding: 4px 0; }
    .session-tasks-inline { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .task-chip { font-size: 10px; font-family: var(--mono); padding: 2px 7px; border-radius: 3px; display: flex; align-items: center; gap: 4px; }
    .task-chip .dot { width: 5px; height: 5px; }
    .task-chip.pending { background: var(--bg-hover); color: var(--text-sec); }
    .task-chip.running { background: var(--blue-bg); color: var(--blue); }
    .task-chip.completed { background: var(--green-bg); color: var(--green); }
    .task-chip.failed { background: var(--red-bg); color: var(--red); }

    /* Event log */
    #event-log { border-top: 1px solid var(--border); background: var(--bg-card); flex-shrink: 0; overflow: hidden; transition: height .2s ease; height: 28px; }
    #event-log.open { height: 220px; }
    .log-toggle { display: flex; align-items: center; gap: 6px; padding: 6px 16px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 500; color: var(--text-sec); border-bottom: 1px solid var(--border-light); }
    .log-toggle:hover { background: var(--bg-hover); }
    .log-toggle-arrow { font-size: 9px; transition: transform .2s; }
    #event-log.open .log-toggle-arrow { transform: rotate(180deg); }
    .log-count { font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: var(--bg-hover); padding: 0 5px; border-radius: 3px; }
    .log-body { overflow-y: auto; height: calc(100% - 29px); }
    .log-row { display: flex; gap: 10px; padding: 2px 16px; font-size: 11px; font-family: var(--mono); border-bottom: 1px solid var(--bg); line-height: 1.7; }
    .log-row:hover { background: var(--bg); }
    .log-time { color: var(--text-dim); flex-shrink: 0; width: 65px; }
    .log-type { flex-shrink: 0; width: 130px; font-weight: 500; }
    .log-type.session_created { color: var(--blue); }
    .log-type.task_started { color: var(--amber); }
    .log-type.task_completed { color: var(--green); }
    .log-type.task_failed { color: var(--red); }
    .log-type.session_completed { color: var(--green); }
    .log-type.session_failed { color: var(--red); }
    .log-type.agent_dead { color: var(--red); }
    .log-detail { color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Settings dialog */
    dialog { border: 1px solid var(--border); border-radius: 6px; padding: 20px; max-width: 380px; width: 90%; font-family: var(--sans); font-size: 13px; }
    dialog::backdrop { background: rgba(0,0,0,.15); }
    .dlg-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
    .dlg-field { margin-bottom: 10px; }
    .dlg-label { display: block; font-size: 11px; font-weight: 500; color: var(--text-sec); margin-bottom: 3px; }
    .dlg-input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--bg); }
    .dlg-input:focus { outline: none; border-color: var(--blue); }
    .dlg-row { display: flex; gap: 10px; }
    .dlg-row > .dlg-field { flex: 1; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .dlg-btn { padding: 6px 14px; border-radius: 4px; font-size: 12px; font-family: var(--sans); cursor: pointer; }
    .dlg-btn-cancel { background: var(--bg); border: 1px solid var(--border); color: var(--text-sec); }
    .dlg-btn-cancel:hover { background: var(--bg-hover); }
    .dlg-btn-primary { background: var(--text); border: none; color: var(--bg-card); }
    .dlg-btn-primary:hover { opacity: .85; }

    @media (max-width: 640px) {
      #sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <span class="hdr-title">Skitter</span>
      <span class="hdr-org" id="hdr-org">skitter/default</span>
      <span class="hdr-spacer"></span>
      <span class="hdr-status" id="hdr-mqtt">
        <span class="dot dot-off" id="dot-mqtt"></span>
        <span id="lbl-mqtt">Disconnected</span>
      </span>
      <span class="hdr-status" id="hdr-coord">
        <span class="dot dot-off" id="dot-coord"></span>
        <span id="lbl-coord">Coordinator</span>
      </span>
      <button class="hdr-btn" onclick="showSettings()">Settings</button>
    </div>
    <div id="body">
      <aside id="sidebar">
        <div class="side-section" id="sec-agents">
          <div class="side-hdr">Agents</div>
          <div id="agent-list"></div>
        </div>
        <div class="side-section" id="sec-apps">
          <div class="side-hdr">Apps</div>
          <div id="app-list"></div>
        </div>
      </aside>
      <div id="main">
        <div id="sessions"></div>
      </div>
    </div>
    <div id="event-log">
      <div class="log-toggle" onclick="toggleLog()">
        <span class="log-toggle-arrow">&#9660;</span>
        Event Log
        <span class="log-count" id="log-count">0</span>
      </div>
      <div class="log-body" id="log-body"></div>
    </div>
  </div>

  <dialog id="settings-dlg">
    <div class="dlg-title">Broker Settings</div>
    <div class="dlg-field">
      <label class="dlg-label">WebSocket URL</label>
      <input class="dlg-input" id="cfg-url" type="text" placeholder="ws://localhost:8083/mqtt">
    </div>
    <div class="dlg-row">
      <div class="dlg-field">
        <label class="dlg-label">Username</label>
        <input class="dlg-input" id="cfg-user" type="text">
      </div>
      <div class="dlg-field">
        <label class="dlg-label">Password</label>
        <input class="dlg-input" id="cfg-pass" type="password">
      </div>
    </div>
    <div class="dlg-row">
      <div class="dlg-field">
        <label class="dlg-label">Org</label>
        <input class="dlg-input" id="cfg-org" type="text" placeholder="skitter">
      </div>
      <div class="dlg-field">
        <label class="dlg-label">Unit</label>
        <input class="dlg-input" id="cfg-unit" type="text" placeholder="default">
      </div>
    </div>
    <div class="dlg-actions">
      <button class="dlg-btn dlg-btn-cancel" onclick="document.getElementById('settings-dlg').close()">Cancel</button>
      <button class="dlg-btn dlg-btn-primary" onclick="saveSettings()">Save &amp; Reconnect</button>
    </div>
  </dialog>

  <script>
    // ── State ──────────────────────────────────────────────

    const S = {
      connected: false,
      coordinatorAlive: false,
      org: 'skitter',
      unit: 'default',
      agents: new Map(),   // id -> { card, alive }
      apps: new Map(),     // id -> card
      sessions: new Map(), // session_id -> session object
      events: [],          // event log entries
      logOpen: false,
    };

    const MAX_SESSIONS = 50;
    const MAX_EVENTS = 200;
    let mqttClient = null;

    // ── Config (localStorage) ──────────────────────────────

    const DEFAULTS = { url: 'ws://localhost:8083/mqtt', username: '', password: '', org: 'skitter', unit: 'default' };

    function loadConfig() {
      return {
        url: localStorage.getItem('sk_url') || DEFAULTS.url,
        username: localStorage.getItem('sk_user') || DEFAULTS.username,
        password: localStorage.getItem('sk_pass') || DEFAULTS.password,
        org: localStorage.getItem('sk_org') || DEFAULTS.org,
        unit: localStorage.getItem('sk_unit') || DEFAULTS.unit,
      };
    }

    function showSettings() {
      const c = loadConfig();
      document.getElementById('cfg-url').value = c.url;
      document.getElementById('cfg-user').value = c.username;
      document.getElementById('cfg-pass').value = c.password;
      document.getElementById('cfg-org').value = c.org;
      document.getElementById('cfg-unit').value = c.unit;
      document.getElementById('settings-dlg').showModal();
    }

    function saveSettings() {
      localStorage.setItem('sk_url', document.getElementById('cfg-url').value.trim() || DEFAULTS.url);
      localStorage.setItem('sk_user', document.getElementById('cfg-user').value.trim());
      localStorage.setItem('sk_pass', document.getElementById('cfg-pass').value);
      localStorage.setItem('sk_org', document.getElementById('cfg-org').value.trim() || DEFAULTS.org);
      localStorage.setItem('sk_unit', document.getElementById('cfg-unit').value.trim() || DEFAULTS.unit);
      document.getElementById('settings-dlg').close();
      if (mqttClient) mqttClient.end(true);
      initConnection();
    }

    // ── Utilities ──────────────────────────────────────────

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function trunc(s, n) { return !s ? '' : s.length > n ? s.slice(0, n) + '...' : s; }
    function shortId(id) { return id ? id.slice(0, 8) : ''; }

    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function fmtAgo(iso) {
      if (!iso) return '';
      const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (sec < 0 || isNaN(sec)) return '';
      if (sec < 10) return 'just now';
      if (sec < 60) return sec + 's ago';
      if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
      if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
      return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    // ── MQTT ───────────────────────────────────────────────

    function initConnection() {
      const cfg = loadConfig();
      S.org = cfg.org;
      S.unit = cfg.unit;
      S.connected = false;
      S.coordinatorAlive = false;
      S.agents.clear();
      S.apps.clear();
      S.sessions.clear();
      S.events = [];

      document.getElementById('hdr-org').textContent = `${S.org}/${S.unit}`;
      renderAll();

      const clientId = 'skitter-dash-' + Math.random().toString(16).slice(2, 10);
      const opts = { protocolVersion: 5, reconnectPeriod: 3000, connectTimeout: 10000, clean: true, clientId };
      if (cfg.username) { opts.username = cfg.username; opts.password = cfg.password; }

      mqttClient = mqtt.connect(cfg.url, opts);

      mqttClient.on('connect', () => {
        S.connected = true;
        renderHeader();
        const pfx = '$a2a/v1';
        mqttClient.subscribe(`${pfx}/discovery/${S.org}/${S.unit}/+`, { qos: 1 });
        mqttClient.subscribe(`${pfx}/event/${S.org}/${S.unit}/+`, { qos: 1 });
        mqttClient.subscribe(`${pfx}/lock/${S.org}/${S.unit}/coordinator`, { qos: 1 });
      });

      mqttClient.on('close', () => {
        S.connected = false;
        S.coordinatorAlive = false;
        renderHeader();
      });

      mqttClient.on('error', e => console.error('MQTT:', e));
      mqttClient.on('message', onMessage);
    }

    function onMessage(topic, payload) {
      const raw = payload.toString();
      const parts = topic.split('/');
      // $a2a/v1/<type>/<org>/<unit>/<id>
      if (parts.length < 6) return;
      const type = parts[2];
      const id = parts[5];

      if (type === 'discovery') handleDiscovery(id, raw);
      else if (type === 'event') handleEvent(id, raw);
      else if (type === 'lock') handleLock(raw);
    }

    // ── Discovery ──────────────────────────────────────────

    function getWorkflowTasks(card) {
      for (const ext of (card.capabilities || {}).extensions || []) {
        if (ext.uri === 'urn:skitter:workflow' && ext.params && ext.params.tasks && ext.params.tasks.length) {
          return ext.params.tasks;
        }
      }
      return null;
    }

    function handleDiscovery(agentId, raw) {
      if (agentId === 'skitter') return; // skip coordinator card
      if (!raw) {
        S.agents.delete(agentId);
        S.apps.delete(agentId);
        renderSidebar();
        return;
      }
      try {
        const card = JSON.parse(raw);
        if (getWorkflowTasks(card)) {
          S.apps.set(agentId, card);
        } else {
          const existing = S.agents.get(agentId);
          S.agents.set(agentId, { card, alive: existing ? existing.alive : true });
        }
        renderSidebar();
      } catch (e) { /* ignore malformed cards */ }
    }

    // ── Events ─────────────────────────────────────────────

    function handleEvent(agentId, raw) {
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        const ev = data.event;

        // Agent LWT: dead event
        if (ev === 'dead' && data.agent) {
          const agent = S.agents.get(data.agent);
          if (agent) { agent.alive = false; renderSidebar(); }
          addLogEntry({ type: 'agent_dead', detail: data.agent, time: data.timestamp });
          return;
        }

        // Agent alive (reconnect publishes alive event or fresh card)
        if (ev === 'alive' && data.agent) {
          const agent = S.agents.get(data.agent);
          if (agent) { agent.alive = true; renderSidebar(); }
          return;
        }

        // Coordinator lifecycle events (published on skitter's event topic)
        if (agentId === 'skitter') handleCoordinatorEvent(data);
      } catch (e) { /* ignore */ }
    }

    function handleCoordinatorEvent(data) {
      const ev = data.event;
      const sid = data.session_id;
      const d = data.data || {};

      switch (ev) {
        case 'session_created': {
          const session = {
            app_id: d.app_id || '',
            app_name: d.app_name || d.app_id || '',
            state: 'running',
            graph: d.graph || [],
            tasks: new Map(),
            created: data.timestamp,
            error: '',
          };
          for (const t of session.graph) {
            session.tasks.set(t.id, { agent: t.agent, state: 'pending', error: '', description: t.description || '' });
          }
          S.sessions.set(sid, session);
          pruneOldSessions();
          break;
        }
        case 'task_started': {
          const sess = S.sessions.get(sid);
          if (sess) {
            const tid = data.task_id;
            let task = sess.tasks.get(tid);
            if (!task) {
              task = { agent: d.agent || '', state: 'pending', error: '', description: '' };
              sess.tasks.set(tid, task);
            }
            task.state = 'running';
            if (d.agent) task.agent = d.agent;
          }
          break;
        }
        case 'task_completed': {
          const sess = S.sessions.get(sid);
          if (sess) {
            const task = sess.tasks.get(data.task_id);
            if (task) task.state = 'completed';
          }
          break;
        }
        case 'task_failed': {
          const sess = S.sessions.get(sid);
          if (sess) {
            const task = sess.tasks.get(data.task_id);
            if (task) { task.state = 'failed'; task.error = d.error || ''; }
          }
          break;
        }
        case 'session_completed': {
          const sess = S.sessions.get(sid);
          if (sess) sess.state = 'completed';
          break;
        }
        case 'session_failed': {
          const sess = S.sessions.get(sid);
          if (sess) { sess.state = 'failed'; sess.error = d.error || ''; }
          break;
        }
      }

      addLogEntry({
        type: ev,
        session_id: sid || '',
        task_id: data.task_id || '',
        agent: d.agent || '',
        error: d.error || '',
        app_id: d.app_id || '',
        time: data.timestamp,
      });

      renderSessions();
    }

    function handleLock(raw) {
      S.coordinatorAlive = !!raw;
      renderHeader();
    }

    // ── Log ────────────────────────────────────────────────

    function addLogEntry(entry) {
      S.events.push(entry);
      if (S.events.length > MAX_EVENTS) S.events.splice(0, S.events.length - MAX_EVENTS);
      renderLog();
    }

    function pruneOldSessions() {
      if (S.sessions.size <= MAX_SESSIONS) return;
      // Remove oldest terminal sessions first
      const sorted = [...S.sessions.entries()].sort((a, b) => {
        const aT = a[1].state !== 'running' ? 0 : 1;
        const bT = b[1].state !== 'running' ? 0 : 1;
        if (aT !== bT) return aT - bT;
        return (new Date(a[1].created || 0)) - (new Date(b[1].created || 0));
      });
      while (S.sessions.size > MAX_SESSIONS) {
        S.sessions.delete(sorted.shift()[0]);
      }
    }

    // ── DAG computation ────────────────────────────────────

    function computeLevels(graph) {
      const levels = {};
      const taskMap = {};
      for (const t of graph) taskMap[t.id] = t;

      function visit(id) {
        if (id in levels) return levels[id];
        const t = taskMap[id];
        if (!t || !t.needs || t.needs.length === 0) { levels[id] = 0; return 0; }
        let max = 0;
        for (const n of t.needs) max = Math.max(max, visit(n) + 1);
        levels[id] = max;
        return max;
      }

      for (const t of graph) visit(t.id);
      return levels;
    }

    function groupByLevel(graph, levels) {
      const groups = [];
      for (const t of graph) {
        const lv = levels[t.id] || 0;
        while (groups.length <= lv) groups.push([]);
        groups[lv].push(t);
      }
      return groups;
    }

    // ── Render: Header ─────────────────────────────────────

    function renderHeader() {
      const dotMqtt = document.getElementById('dot-mqtt');
      const lblMqtt = document.getElementById('lbl-mqtt');
      const dotCoord = document.getElementById('dot-coord');
      const lblCoord = document.getElementById('lbl-coord');

      dotMqtt.className = 'dot ' + (S.connected ? 'dot-on' : 'dot-off');
      lblMqtt.textContent = S.connected ? 'Connected' : 'Disconnected';
      dotCoord.className = 'dot ' + (S.coordinatorAlive ? 'dot-on' : 'dot-off');
      lblCoord.textContent = S.coordinatorAlive ? 'Coordinator up' : 'Coordinator down';
    }

    // ── Render: Sidebar ────────────────────────────────────

    function renderSidebar() {
      renderAgentList();
      renderAppList();
    }

    function renderAgentList() {
      const el = document.getElementById('agent-list');
      if (S.agents.size === 0) {
        el.innerHTML = '<div class="side-empty">No agents discovered</div>';
        return;
      }
      let h = '';
      for (const [id, { card, alive }] of S.agents) {
        const dotClass = alive ? 'dot-on' : 'dot-off';
        const desc = card.description || '';
        const skills = (card.skills || []).map(s => s.tags || []).flat();
        h += `<div class="side-item" onclick="this.classList.toggle('expanded')">
          <div class="side-item-name"><span class="dot ${dotClass}"></span>${esc(card.name || id)}</div>
          ${desc ? `<div class="side-item-desc">${esc(trunc(desc, 60))}</div>` : ''}
          <div class="side-item-detail">
            <div class="detail-row"><span class="detail-label">id</span>${esc(id)}</div>
            ${card.version ? `<div class="detail-row"><span class="detail-label">version</span>${esc(card.version)}</div>` : ''}
            ${desc ? `<div class="detail-row"><span class="detail-label">desc</span>${esc(desc)}</div>` : ''}
            ${card.capabilities ? `<div class="detail-row"><span class="detail-label">caps</span>${esc(Object.entries(card.capabilities).filter(([,v])=>v).map(([k])=>k).join(', ') || 'none')}</div>` : ''}
          </div>
          ${skills.length ? `<div class="side-item-tags">${skills.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>`;
      }
      el.innerHTML = h;
    }

    function renderAppList() {
      const el = document.getElementById('app-list');
      if (S.apps.size === 0) {
        el.innerHTML = '<div class="side-empty">No apps registered</div>';
        return;
      }
      let h = '';
      for (const [id, card] of S.apps) {
        const tasks = getWorkflowTasks(card) || [];
        const desc = card.description || '';
        h += `<div class="side-item" onclick="this.classList.toggle('expanded')">
          <div class="side-item-name">${esc(card.name || id)}</div>
          <div class="side-item-desc">${tasks.length} task${tasks.length !== 1 ? 's' : ''}${desc ? ' \u00b7 ' + esc(trunc(desc, 40)) : ''}</div>
          <div class="side-item-detail">
            <div class="detail-row"><span class="detail-label">id</span>${esc(id)}</div>
            ${card.version ? `<div class="detail-row"><span class="detail-label">version</span>${esc(card.version)}</div>` : ''}
            ${desc ? `<div class="detail-row"><span class="detail-label">desc</span>${esc(desc)}</div>` : ''}
            ${tasks.map(t => `<div class="detail-row"><span class="detail-label">${esc(t.id)}</span>${esc(t.agent)}${t.description ? ': ' + esc(trunc(t.description, 50)) : ''}</div>`).join('')}
          </div>
        </div>`;
      }
      el.innerHTML = h;
    }

    // ── Render: Sessions ───────────────────────────────────

    function renderSessions() {
      const el = document.getElementById('sessions');

      if (S.sessions.size === 0) {
        el.innerHTML = `<div class="sessions-empty">
          <div class="sessions-empty-title">No active sessions</div>
          <div class="sessions-empty-hint">Run a composed app to see activity here</div>
        </div>`;
        return;
      }

      // Sort: running first, then by creation time (newest first)
      const sorted = [...S.sessions.entries()].sort((a, b) => {
        const aR = a[1].state === 'running' ? 0 : 1;
        const bR = b[1].state === 'running' ? 0 : 1;
        if (aR !== bR) return aR - bR;
        return (new Date(b[1].created || 0)) - (new Date(a[1].created || 0));
      });

      let h = '';
      for (const [sid, sess] of sorted) {
        const terminal = sess.state !== 'running';
        const appLabel = sess.app_name || sess.app_id || '';

        h += `<div class="session-card${terminal ? ' terminal' : ''}">
          <div class="session-hdr">
            ${appLabel ? `<span class="session-app">${esc(appLabel)}</span>` : ''}
            <span class="session-id">${esc(shortId(sid))}</span>
            <span class="session-badge ${sess.state}">${esc(sess.state)}</span>
            <span class="session-time">${esc(fmtAgo(sess.created))}</span>
          </div>
          ${renderDag(sess)}
          ${sess.error ? `<div class="session-error">${esc(trunc(sess.error, 200))}</div>` : ''}
        </div>`;
      }
      el.innerHTML = h;
    }

    function renderDag(sess) {
      // If we have graph data, render as a proper DAG
      if (sess.graph.length > 0) {
        const levels = computeLevels(sess.graph);
        const groups = groupByLevel(sess.graph, levels);

        let h = '<div class="dag">';
        for (let i = 0; i < groups.length; i++) {
          if (i > 0) h += '<div class="dag-arrow">\u2192</div>';
          h += '<div class="dag-level">';
          for (const t of groups[i]) {
            const taskState = sess.tasks.get(t.id);
            const st = taskState ? taskState.state : 'pending';
            const agent = taskState ? taskState.agent : t.agent;
            const error = taskState ? taskState.error : '';
            const desc = t.description || '';
            const dotClass = st === 'running' ? 'dot-pulse' : st === 'completed' ? 'dot-on' : st === 'failed' ? 'dot-off' : '';

            h += `<div class="dag-task ${st}">
              <span class="dot ${dotClass}"></span>
              <span class="dag-task-id">${esc(t.id)}</span>
              ${agent ? `<span class="dag-task-agent">${esc(agent)}</span>` : ''}
              ${desc ? `<div class="dag-task-tooltip">${esc(desc)}</div>` : ''}
              ${error ? `<div class="dag-task-error">${esc(trunc(error, 120))}</div>` : ''}
            </div>`;
          }
          h += '</div>';
        }
        h += '</div>';
        return h;
      }

      // Fallback: no graph data, just show task chips from events
      if (sess.tasks.size > 0) {
        let h = '<div class="session-tasks-inline">';
        for (const [tid, task] of sess.tasks) {
          const dotClass = task.state === 'running' ? 'dot-pulse' : task.state === 'completed' ? 'dot-on' : task.state === 'failed' ? 'dot-off' : '';
          h += `<span class="task-chip ${task.state}"><span class="dot ${dotClass}"></span>${esc(tid)}${task.agent ? ' \u00b7 ' + esc(task.agent) : ''}</span>`;
        }
        h += '</div>';
        return h;
      }

      return '<div class="session-minimal">Waiting for tasks...</div>';
    }

    // ── Render: Event Log ──────────────────────────────────

    function renderLog() {
      document.getElementById('log-count').textContent = S.events.length;

      if (!S.logOpen) return;

      const el = document.getElementById('log-body');
      let h = '';
      // Render newest first
      for (let i = S.events.length - 1; i >= 0; i--) {
        const e = S.events[i];
        const time = fmtTime(e.time);
        const type = e.type || '';

        let detail = '';
        if (e.session_id) detail += shortId(e.session_id);
        if (e.task_id) detail += ' / ' + e.task_id;
        if (e.agent) detail += ' \u2192 ' + e.agent;
        if (e.app_id) detail += ' (' + e.app_id + ')';
        if (e.error) detail += ' : ' + trunc(e.error, 80);
        if (e.detail) detail = e.detail;

        h += `<div class="log-row">
          <span class="log-time">${esc(time)}</span>
          <span class="log-type ${esc(type)}">${esc(type)}</span>
          <span class="log-detail">${esc(detail)}</span>
        </div>`;
      }
      el.innerHTML = h || '<div style="padding:12px 16px;color:var(--text-dim);font-size:11px;">No events yet</div>';
    }

    function toggleLog() {
      S.logOpen = !S.logOpen;
      document.getElementById('event-log').classList.toggle('open', S.logOpen);
      if (S.logOpen) renderLog();
    }

    // ── Render all ─────────────────────────────────────────

    function renderAll() {
      renderHeader();
      renderSidebar();
      renderSessions();
      renderLog();
    }

    // ── Periodic refresh for relative times ────────────────

    setInterval(() => {
      if (S.sessions.size > 0) renderSessions();
    }, 30000);

    // ── Init ───────────────────────────────────────────────

    initConnection();
  </script>
</body>
</html>
