[project]
name = "skitter"
version = "0.1.0"
description = "MQTT-based Personal AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "aiomqtt>=2.5.0",
    "python-dotenv>=1.2.1",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "paho-mqtt>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
skitter = "skitter.__main__:dispatch"

[project.optional-dependencies]
cloud = ["boto3>=1.35"]
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.1"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
