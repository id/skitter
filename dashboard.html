<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skitter</title>
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f7f8fa;
      --bg-hover: #f0f1f4;
      --border: #e2e4e9;
      --border-light: #eef0f3;
      --text: #1a1d23;
      --text-sec: #5f6672;
      --text-dim: #9ba3b0;
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: var(--sans); font-size: 13px; color: var(--text); background: var(--bg); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Layout */
    #app { display: flex; height: 100vh; }
    #sidebar { width: 260px; min-width: 260px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-alt); }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Sidebar header */
    .side-hdr { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .side-hdr h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .conn-dot.on { background: var(--green); }

    /* Sidebar tabs */
    .side-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .side-tab { flex: 1; padding: 8px; font-size: 11px; font-weight: 500; text-align: center; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
    .side-tab:hover { color: var(--text-sec); }
    .side-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* Sidebar panels */
    .side-panel { flex: 1; overflow-y: auto; display: none; }
    .side-panel.active { display: block; }

    /* Session list */
    .sess-item { padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all .1s; }
    .sess-item:hover { background: var(--bg-hover); }
    .sess-item.active { background: var(--bg); border-left-color: var(--blue); }
    .sess-id { font-size: 11px; font-family: var(--mono); color: var(--text-sec); display: flex; align-items: center; gap: 6px; }
    .sess-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .sess-dot.running { background: var(--blue); animation: pulse 2s ease-in-out infinite; }
    .sess-dot.done { background: var(--green); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .sess-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Agent/workflow list */
    .config-item { padding: 10px 16px; border-bottom: 1px solid var(--border-light); cursor: pointer; border-left: 3px solid transparent; transition: all .1s; }
    .config-item:last-child { border-bottom: none; }
    .config-item:hover { background: var(--bg-hover); }
    .config-item.active { background: var(--bg); border-left-color: var(--blue); }
    .config-name { font-size: 12px; font-weight: 600; }
    .config-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .config-badge { display: inline-block; font-size: 10px; font-family: var(--mono); padding: 1px 5px; border-radius: 3px; background: var(--bg-hover); color: var(--text-sec); margin-left: 6px; }

    /* Compose view (main area) */
    .compose-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; }
    .compose-card { width: 100%; max-width: 560px; }
    .compose-card-hdr { margin-bottom: 20px; }
    .compose-card-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .compose-card-type { font-size: 11px; font-family: var(--mono); color: var(--blue); background: #eff6ff; padding: 2px 8px; border-radius: 4px; margin-left: 10px; vertical-align: middle; }
    .compose-card-desc { font-size: 13px; line-height: 1.6; color: var(--text-sec); margin-top: 8px; }
    .compose-card-props { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .compose-prop { font-size: 11px; padding: 3px 10px; border-radius: 4px; background: var(--bg-alt); border: 1px solid var(--border); color: var(--text-sec); }
    .compose-prop span { font-weight: 600; color: var(--text); }
    .wf-graph { display: flex; flex-direction: column; align-items: center; gap: 0; margin: 20px 0 4px; padding: 16px; background: var(--bg-alt); border-radius: 10px; border: 1px solid var(--border); }
    .wf-layer { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .wf-node { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; min-width: 120px; text-align: center; transition: border-color .15s; }
    .wf-node:hover { border-color: var(--blue); }
    .wf-terminal { border-style: double; border-width: 3px; }
    .wf-node-id { font-size: 12px; font-weight: 700; font-family: var(--mono); color: var(--text); letter-spacing: -0.01em; }
    .wf-node-agent { font-size: 11px; color: var(--blue); margin-top: 3px; }
    .wf-node-model { font-size: 10px; color: var(--text-dim); font-family: var(--mono); margin-top: 2px; }
    .wf-arrow { font-size: 11px; color: var(--text-dim); padding: 6px 0; text-align: center; letter-spacing: 0.5px; }
    .compose-input-wrap { position: relative; margin-top: 20px; }
    .compose-textarea { width: 100%; padding: 12px 14px; padding-right: 48px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: var(--sans); resize: none; min-height: 48px; max-height: 200px; outline: none; color: var(--text); line-height: 1.5; transition: border-color .15s; }
    .compose-textarea::placeholder { color: var(--text-dim); }
    .compose-textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
    .compose-send { position: absolute; right: 8px; bottom: 8px; width: 32px; height: 32px; border: none; background: var(--blue); color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: opacity .15s; }
    .compose-send:hover { opacity: .85; }
    .compose-send:disabled { opacity: .3; cursor: default; }
    .compose-hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; text-align: right; }

    /* Session result */
    .session-result { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
    .session-result-hdr { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--green); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .session-result-hdr .result-actions { margin-left: auto; display: flex; gap: 4px; }
    .result-act { font-size: 10px; font-weight: 500; color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; cursor: pointer; text-transform: none; letter-spacing: 0; }
    .result-act:hover { color: var(--text); border-color: var(--text-dim); }
    .session-result-text { font-size: 13px; line-height: 1.7; color: var(--text); max-height: 400px; overflow-y: auto; }
    .session-result-text h1, .session-result-text h2, .session-result-text h3, .session-result-text h4 { margin: 12px 0 6px; font-weight: 600; color: var(--text); }
    .session-result-text h1 { font-size: 18px; } .session-result-text h2 { font-size: 15px; } .session-result-text h3 { font-size: 13px; }
    .session-result-text p { margin: 6px 0; }
    .session-result-text ul, .session-result-text ol { margin: 6px 0; padding-left: 20px; }
    .session-result-text li { margin: 3px 0; }
    .session-result-text code { font-family: var(--mono); font-size: 12px; background: var(--bg-hover); padding: 1px 5px; border-radius: 3px; }
    .session-result-text pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
    .session-result-text pre code { background: none; padding: 0; }
    .session-result-text blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--text-sec); margin: 8px 0; }
    .session-result-text a { color: var(--blue); text-decoration: none; }
    .session-result-text a:hover { text-decoration: underline; }
    .session-result-text table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
    .session-result-text th, .session-result-text td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .session-result-text th { background: var(--bg-hover); font-weight: 600; }
    .session-result-text hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

    /* Main header */
    .main-hdr { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--bg); }
    .main-hdr h2 { font-size: 14px; font-weight: 600; }
    .main-hdr .badge { font-size: 10px; font-family: var(--mono); padding: 2px 8px; border-radius: 4px; }
    .badge-workflow { background: #eff6ff; color: var(--blue); }
    .badge-agent { background: #f0fdf4; color: var(--green); }
    .usage-bar { margin-left: auto; display: flex; gap: 14px; font-size: 11px; color: var(--text-dim); }
    .usage-bar .val { font-weight: 600; color: var(--text-sec); }
    .usage-bar .cost { color: var(--amber); font-weight: 600; }

    /* Task grid */
    #task-area { flex: 1; overflow: auto; padding: 16px 20px; }
    .task-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .col-hdr { display: flex; align-items: center; gap: 6px; padding: 0 0 8px; }
    .col-hdr h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
    .col-hdr .cnt { font-size: 10px; font-weight: 600; color: var(--text-dim); background: var(--bg-hover); padding: 1px 7px; border-radius: 10px; }
    .col-dot { width: 7px; height: 7px; border-radius: 50%; }
    .col-dot.pending { background: var(--text-dim); }
    .col-dot.running { background: var(--blue); }
    .col-dot.done { background: var(--green); }

    .task-col { display: flex; flex-direction: column; gap: 8px; }

    /* Task cards */
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all .1s; border-left: 3px solid var(--text-dim); }
    .card:hover { border-color: var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card.selected { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    .card.running { border-left-color: var(--blue); }
    .card.done { border-left-color: var(--green); }
    .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .card-id { font-size: 12px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-model { font-size: 10px; font-family: var(--mono); color: var(--blue); background: #eff6ff; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }
    .card-agent { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
    .card-desc { font-size: 11px; color: var(--text-sec); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-preview { font-size: 10px; font-family: var(--mono); color: var(--text-dim); background: var(--bg-alt); border-radius: 4px; padding: 3px 6px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 10px; }
    .card-tokens { color: var(--text-dim); }
    .card-cost { color: var(--amber); font-weight: 500; }
    .stop-btn { font-size: 10px; font-weight: 500; color: var(--red); background: #fef2f2; border: 1px solid #fecaca; padding: 2px 8px; border-radius: 4px; cursor: pointer; margin-left: auto; }
    .stop-btn:hover { background: #fee2e2; }

    .stream-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); display: inline-block; animation: pulse 1s ease-in-out infinite; }
    .worker-dot { width: 5px; height: 5px; border-radius: 50%; }
    .worker-dot.alive { background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
    .worker-dot.dead { background: var(--red); }

    /* Empty state */
    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); gap: 6px; }
    .empty-title { font-size: 14px; font-weight: 500; }
    .empty-hint { font-size: 12px; }

    /* Detail panel */
    #detail { border-top: 1px solid var(--border); background: var(--bg-alt); overflow-y: auto; flex-shrink: 0; max-height: 0; transition: max-height .2s ease; }
    #detail.open { max-height: 45vh; }
    #detail.expanded { max-height: 85vh; }
    #detail-inner { padding: 16px 20px; }
    .det-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .det-hdr h2 { font-size: 15px; font-weight: 600; }
    .det-close { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; font-size: 11px; padding: 3px 10px; border-radius: 4px; }
    .det-close:hover { background: var(--bg-hover); color: var(--text); }
    .det-section { margin-bottom: 12px; }
    .det-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 4px; }
    .det-text { font-size: 12px; line-height: 1.6; color: var(--text-sec); white-space: pre-wrap; word-wrap: break-word; }
    .det-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-y: auto; }
    .det-result-md { font-size: 13px; line-height: 1.7; color: var(--text); max-height: 60vh; overflow-y: auto; }
    .det-result-md p { margin: 0 0 8px; }
    .det-result-md h1, .det-result-md h2, .det-result-md h3 { margin: 12px 0 6px; font-weight: 600; }
    .det-result-md h1 { font-size: 16px; } .det-result-md h2 { font-size: 14px; } .det-result-md h3 { font-size: 13px; }
    .det-result-md ul, .det-result-md ol { margin: 6px 0; padding-left: 20px; }
    .det-result-md li { margin: 3px 0; }
    .det-result-md code { font-family: var(--mono); background: var(--bg-alt); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
    .det-result-md pre { background: var(--bg-alt); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 11px; margin: 8px 0; }
    .det-result-md pre code { background: none; padding: 0; }
    .det-result-md blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--text-sec); margin: 8px 0; }
    .det-result-md a { color: var(--blue); text-decoration: none; }
    .det-result-md a:hover { text-decoration: underline; }
    .det-result-md table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
    .det-result-md th, .det-result-md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
    .det-result-md th { background: var(--bg-hover); font-weight: 600; }
    .det-result-actions { display: flex; gap: 6px; margin-top: 8px; }
    .det-act { background: none; border: 1px solid var(--border); color: var(--text-sec); cursor: pointer; font-size: 11px; padding: 3px 10px; border-radius: 4px; font-family: var(--sans); }
    .det-act:hover { background: var(--bg-hover); color: var(--text); }
    .det-stream { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; max-height: 250px; overflow-y: auto; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--text-sec); white-space: pre-wrap; word-wrap: break-word; }
    .det-stream .tool { color: var(--blue); }
    .det-stream .err { color: var(--red); }
    .det-deps { display: flex; flex-wrap: wrap; gap: 4px; }
    .dep-tag { font-size: 11px; padding: 2px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text-sec); cursor: pointer; }
    .dep-tag:hover { border-color: var(--blue); color: var(--blue); }
    .det-usage { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
    .ustat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
    .ustat-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
    .ustat-val { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 2px; }
    .ustat-val.cost { color: var(--amber); }
    .det-meta { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

    .badge-status { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 4px; }
    .badge-status.pending { background: #f3f4f6; color: var(--text-dim); }
    .badge-status.running { background: #eff6ff; color: var(--blue); }
    .badge-status.done { background: #f0fdf4; color: var(--green); }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar { display: none; }
      .task-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-hdr">
        <h1>Skitter</h1>
        <span class="conn-dot" id="conn-dot" title="Disconnected"></span>
      </div>
      <div class="side-tabs">
        <div class="side-tab active" data-tab="sessions">Sessions</div>
        <div class="side-tab" data-tab="agents">Agents</div>
        <div class="side-tab" data-tab="workflows">Workflows</div>
      </div>
      <div class="side-panel active" id="panel-sessions"></div>
      <div class="side-panel" id="panel-agents"></div>
      <div class="side-panel" id="panel-workflows"></div>
    </aside>
    <div id="main">
      <div class="main-hdr" id="main-hdr">
        <h2 id="hdr-title">No session selected</h2>
      </div>
      <div id="task-area"></div>
      <div id="detail"><div id="detail-inner"></div></div>
    </div>
  </div>

  <script>
    const BROKER_URL = 'ws://localhost:8083/mqtt';

    const state = {
      connected: false,
      sessions: new Map(),
      taskStatus: new Map(),
      taskResults: new Map(),
      workerStatus: new Map(),
      taskUsage: new Map(),
      streamChunks: new Map(),
      agentCards: new Map(),
      workflowCards: new Map(),
      selectedSessionId: null,
      selectedTaskId: null,
      composeTarget: null, // { type: 'agent'|'workflow', id: string }
    };
    let mqttClient = null;
    let streamRenderPending = false;

    // --- Utilities ---
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function trunc(s, n) { return !s ? '' : s.length > n ? s.slice(0, n) + '\u2026' : s; }
    function fmtTok(n) { return n == null ? '?' : n >= 1000 ? (n/1000).toFixed(1) + 'k' : String(n); }
    function isActive(s) {
      return Object.values(s.tasks).some(t => {
        const ts = state.taskStatus.get(`${s.session_id}/${t.task_id}`);
        return (ts || t.status) !== 'done';
      });
    }

    function sessionUsage(sid) {
      const s = state.sessions.get(sid);
      if (!s) return null;
      let ti = 0, to = 0, tc = 0, n = 0;
      for (const t of Object.values(s.tasks)) {
        const u = state.taskUsage.get(`${sid}/${t.task_id}`);
        if (u && u.usage) { ti += u.usage.input_tokens || 0; to += u.usage.output_tokens || 0; if (u.cost_usd != null) tc += u.cost_usd; n++; }
      }
      return n ? { input: ti, output: to, cost: tc } : null;
    }

    function latestStream(sid, task) {
      const ch = state.streamChunks.get(`${sid}/${task.task_id}`);
      if (!ch || !ch.length) return null;
      for (let i = ch.length - 1; i >= 0; i--) if (ch[i].type === 'text') return ch[i].content;
      return ch[ch.length - 1].content;
    }

    function findSessionForTask(taskId) {
      for (const [sid, s] of state.sessions) for (const t of Object.values(s.tasks)) if (t.task_id === taskId) return sid;
      return null;
    }

    function scheduleStreamRender() {
      if (!streamRenderPending) { streamRenderPending = true; setTimeout(() => { renderTasks(); renderDetail(); streamRenderPending = false; }, 400); }
    }

    // --- MQTT ---
    function connect() {
      mqttClient = mqtt.connect(BROKER_URL, { protocolVersion: 5, reconnectPeriod: 3000, connectTimeout: 5000, clean: true });
      mqttClient.on('connect', () => { state.connected = true; renderConn(); mqttClient.subscribe('$a2a/v1/#', { qos: 1 }); });
      mqttClient.on('close', () => { state.connected = false; renderConn(); });
      mqttClient.on('error', e => console.error('MQTT:', e));
      mqttClient.on('message', onMessage);
    }

    function onMessage(topic, payload) {
      const raw = payload.toString();
      const p = topic.split('/');

      // Session state
      if (p[2] === 'state' && p[5] === 'sessions' && p.length === 7) {
        const sid = p[6];
        if (!raw) { state.sessions.delete(sid); if (state.selectedSessionId === sid) state.selectedTaskId = null; }
        else { try { state.sessions.set(sid, JSON.parse(raw)); } catch(e) { return; } if (!state.selectedSessionId) state.selectedSessionId = sid; }
        renderAll();
        return;
      }

      // Per-task status (retained): $a2a/v1/state/{org}/{unit}/task/{session_id}/{task_id}
      if (p[2] === 'state' && p[5] === 'task' && p.length === 8 && raw) {
        try {
          const m = JSON.parse(raw);
          const sid = p[6], tid = p[7];
          state.taskStatus.set(`${sid}/${tid}`, m.status);
          if (m.result) state.taskResults.set(`${sid}/${tid}`, m.result);
        } catch(e) {}
        renderSessions(); renderTasks(); renderDetail();
        return;
      }

      // Worker events (alive/done/dead)
      if (p[2] === 'event' && raw) {
        try {
          const ev = JSON.parse(raw);
          if (ev.task_id && ev.status) {
            const sid = findSessionForTask(ev.task_id);
            if (sid) state.workerStatus.set(`${sid}/${ev.task_id}`, ev.status);
          }
        } catch(e) {}
        renderTasks();
        return;
      }

      // Usage
      if (p[2] === 'state' && p[5] === 'usage' && p.length === 8 && raw) {
        try { const m = JSON.parse(raw); state.taskUsage.set(`${p[6]}/${p[7]}`, { usage: m.usage, cost_usd: m.cost_usd }); } catch(e) {}
        renderTasks(); renderDetail();
        return;
      }

      // Reply (stream items + results)
      if (p[2] === 'reply' && raw) {
        try {
          const m = JSON.parse(raw);
          if (m.seq != null && m.type) {
            const sid = findSessionForTask(m.task_id);
            if (sid) {
              const k = `${sid}/${m.task_id}`;
              if (!state.streamChunks.has(k)) state.streamChunks.set(k, []);
              const ch = state.streamChunks.get(k);
              // Dedup
              if (!ch.some(c => c.task_id === m.task_id && c.seq === m.seq)) {
                ch.push(m);
                if (ch.length > 200) ch.splice(0, ch.length - 200);
              }
            }
            scheduleStreamRender();
            return;
          }
          if (m.state && m.task_id) {
            const sid = findSessionForTask(m.task_id);
            if (sid) state.taskResults.set(`${sid}/${m.task_id}`, m.result);
            renderDetail();
            return;
          }
        } catch(e) {}
        return;
      }

      // Discovery
      if (p[2] === 'discovery' && raw) {
        try {
          const card = JSON.parse(raw);
          if (card.workflow_id) {
            state.workflowCards.set(card.workflow_id, card);
            renderWorkflows();
          } else if (card.agent_id && card.agent_id !== 'gateway') {
            state.agentCards.set(card.agent_id, card);
            renderAgents();
          }
        } catch(e) {}
        return;
      }
    }

    // --- Cancel ---
    function cancelTask(sid, taskId) {
      if (!mqttClient || !state.connected) return;
      const s = state.sessions.get(sid);
      if (!s) return;
      const t = Object.values(s.tasks).find(x => x.task_id === taskId);
      if (!t) return;
      mqttClient.publish(`$a2a/v1/request/skitter/default/${t.agent}/cancel`, JSON.stringify({
        jsonrpc: '2.0', method: 'tasks/cancel', params: { task_id: taskId, reason: 'Cancelled from dashboard' }, id: crypto.randomUUID(),
      }), { qos: 1 });
    }
    function cancelAll(sid) {
      const s = state.sessions.get(sid);
      if (!s) return;
      for (const t of Object.values(s.tasks)) if (t.status === 'running') cancelTask(sid, t.task_id);
    }

    // --- Send (kept for /agent and /workflow text commands if needed) ---

    // --- Render ---
    function renderConn() {
      const dot = document.getElementById('conn-dot');
      dot.className = 'conn-dot' + (state.connected ? ' on' : '');
      dot.title = state.connected ? 'Connected' : 'Disconnected';
    }

    function renderSessions() {
      const el = document.getElementById('panel-sessions');
      if (state.sessions.size === 0) { el.innerHTML = '<div class="empty" style="padding:40px 0"><span class="empty-hint">No sessions yet</span></div>'; return; }
      let h = '';
      for (const [sid, s] of [...state.sessions].reverse()) {
        const active = isActive(s);
        h += `<div class="sess-item${sid === state.selectedSessionId ? ' active' : ''}" data-sid="${esc(sid)}">
          <div class="sess-id"><span class="sess-dot ${active ? 'running' : 'done'}"></span>${esc(sid)}</div>
          <div class="sess-label">${esc(trunc(s.label || '', 50))}</div>
        </div>`;
      }
      el.innerHTML = h;
      el.querySelectorAll('.sess-item').forEach(el => el.addEventListener('click', () => {
        state.selectedSessionId = el.dataset.sid; state.selectedTaskId = null; state.composeTarget = null; renderAll();
      }));
    }

    function workflowAgentIds() {
      const ids = new Set();
      for (const [, p] of state.workflowCards) {
        if (p.agents) for (const a of p.agents) ids.add(a);
      }
      return ids;
    }

    function renderAgents() {
      const el = document.getElementById('panel-agents');
      const workflowAgents = workflowAgentIds();
      const standalone = [...state.agentCards].filter(([id]) => !workflowAgents.has(id));
      if (standalone.length === 0) { el.innerHTML = '<div class="empty" style="padding:40px 0"><span class="empty-hint">No agents discovered</span></div>'; return; }
      let h = '';
      for (const [id, c] of standalone) {
        const active = state.composeTarget && state.composeTarget.type === 'agent' && state.composeTarget.id === id;
        h += `<div class="config-item${active ? ' active' : ''}" data-agent-id="${esc(id)}">
          <div class="config-name">${esc(id)}${c.model ? `<span class="config-badge">${esc(c.model)}</span>` : ''}</div>
          <div class="config-meta">${esc(c.name || '')}${c.description ? ' \u2014 ' + esc(trunc(c.description, 80)) : ''}</div>
        </div>`;
      }
      el.innerHTML = h;
      el.querySelectorAll('.config-item').forEach(item => item.addEventListener('click', () => {
        const id = item.dataset.agentId;
        if (state.composeTarget && state.composeTarget.type === 'agent' && state.composeTarget.id === id) {
          state.composeTarget = null;
        } else {
          state.composeTarget = { type: 'agent', id };
          state.selectedSessionId = null; state.selectedTaskId = null;
        }
        renderAll();
      }));
    }

    function renderWorkflows() {
      const el = document.getElementById('panel-workflows');
      if (state.workflowCards.size === 0) {
        el.innerHTML = '<div class="empty" style="padding:40px 0"><span class="empty-hint">No workflows discovered</span></div>';
        return;
      }
      let h = '';
      for (const [id, c] of state.workflowCards) {
        const active = state.composeTarget && state.composeTarget.type === 'workflow' && state.composeTarget.id === id;
        const taskCount = c.tasks ? c.tasks.length : 0;
        h += `<div class="config-item${active ? ' active' : ''}" data-workflow-id="${esc(id)}">
          <div class="config-name">${esc(id)}${taskCount ? `<span class="config-badge">${taskCount} tasks</span>` : ''}</div>
          <div class="config-meta">${esc(c.name || '')}${c.description ? ' \u2014 ' + esc(trunc(c.description, 80)) : ''}</div>
        </div>`;
      }
      el.innerHTML = h;
      el.querySelectorAll('.config-item').forEach(item => item.addEventListener('click', () => {
        const id = item.dataset.workflowId;
        if (state.composeTarget && state.composeTarget.type === 'workflow' && state.composeTarget.id === id) {
          state.composeTarget = null;
        } else {
          state.composeTarget = { type: 'workflow', id };
          state.selectedSessionId = null; state.selectedTaskId = null;
        }
        renderAll();
      }));
    }

    function renderHeader() {
      const hdr = document.getElementById('main-hdr');
      const s = state.sessions.get(state.selectedSessionId);
      if (!s) {
        if (state.composeTarget) {
          const label = state.composeTarget.id;
          const badge = state.composeTarget.type;
          hdr.innerHTML = `<h2>${esc(label)}</h2><span class="badge badge-${badge}">${badge}</span>`;
        } else {
          hdr.innerHTML = '<h2 style="color:var(--text-dim)">Skitter Dashboard</h2>';
        }
        return;
      }

      const type = s.workflow_id ? 'workflow' : 'agent';
      const typeLabel = s.workflow_id || s.agent_id || '';
      const usage = sessionUsage(state.selectedSessionId);
      const running = Object.values(s.tasks).filter(t => t.status === 'running');
      const stopAll = running.length > 0 ? `<button class="stop-btn" onclick="cancelAll('${esc(state.selectedSessionId)}')">Stop all</button>` : '';

      let usageHtml = '';
      if (usage) {
        usageHtml = `<div class="usage-bar">
          <span>In <span class="val">${fmtTok(usage.input)}</span></span>
          <span>Out <span class="val">${fmtTok(usage.output)}</span></span>
          <span class="cost">$${usage.cost.toFixed(4)}</span>
        </div>`;
      }

      hdr.innerHTML = `<h2>${esc(state.selectedSessionId)}</h2>
        <span class="badge badge-${type}">${esc(typeLabel)}</span>
        ${stopAll}${usageHtml}`;
    }

    function renderComposeView() {
      const area = document.getElementById('task-area');
      const t = state.composeTarget;
      if (!t) {
        area.innerHTML = '<div class="empty"><div class="empty-title">Select an agent or workflow</div><div class="empty-hint">Browse the sidebar to get started</div></div>';
        return;
      }

      const isAgent = t.type === 'agent';
      const card = isAgent ? state.agentCards.get(t.id) : state.workflowCards.get(t.id);
      if (!card) return;

      const name = card.name || t.id;
      const desc = card.description || '';
      const typeBadge = isAgent ? 'agent' : 'workflow';

      let propsHtml = '';
      if (isAgent) {
        if (card.model) propsHtml += `<span class="compose-prop"><span>Model</span> ${esc(card.model)}</span>`;
        if (card.capabilities && card.capabilities.length) propsHtml += `<span class="compose-prop"><span>Tools</span> ${card.capabilities.includes('tool_use') ? 'yes' : 'no'}</span>`;
        if (card.runtime) propsHtml += `<span class="compose-prop"><span>Runtime</span> ${esc(card.runtime)}</span>`;
      } else {
        if (card.tasks) propsHtml += `<span class="compose-prop"><span>Tasks</span> ${card.tasks.length}</span>`;
        if (card.variables && card.variables.length) propsHtml += `<span class="compose-prop"><span>Variables</span> ${card.variables.join(', ')}</span>`;
        if (card.agents && card.agents.length) propsHtml += `<span class="compose-prop"><span>Agents</span> ${card.agents.join(', ')}</span>`;
      }

      // Workflow composition graph
      let graphHtml = '';
      if (!isAgent && card.tasks && card.tasks.length) {
        const tasks = card.tasks;
        const agentModels = {};
        for (const [aid, ac] of state.agentCards) agentModels[aid] = { model: ac.model || '', runtime: ac.runtime || 'claude' };

        // Group tasks by depth (BFS from entry nodes)
        const taskMap = {};
        tasks.forEach(t => taskMap[t.id] = t);
        // Compute depth from needs (longest path from any root)
        const depths = {};
        function getDepth(id) {
          if (depths[id] !== undefined) return depths[id];
          const t = taskMap[id];
          if (!t || !t.needs || t.needs.length === 0) { depths[id] = 0; return 0; }
          const d = Math.max(...t.needs.map(n => getDepth(n))) + 1;
          depths[id] = d;
          return d;
        }
        tasks.forEach(t => getDepth(t.id));

        // Build layers
        const maxD = Math.max(...Object.values(depths));
        const layers = [];
        for (let d = 0; d <= maxD; d++) layers.push(tasks.filter(t => depths[t.id] === d));

        let g = '<div class="wf-graph">';
        layers.forEach((layer, di) => {
          g += '<div class="wf-layer">';
          layer.forEach(t => {
            const am = agentModels[t.agent] || {};
            const modelLabel = t.model || am.model || 'default';
            const runtimeIcon = am.runtime === 'codex' ? '&#9883;' : '&#9670;';
            const isTerminal = !t.next || t.next === 'output';
            g += `<div class="wf-node${isTerminal ? ' wf-terminal' : ''}">
              <div class="wf-node-id">${esc(t.id)}</div>
              <div class="wf-node-agent">${runtimeIcon} ${esc(t.agent)}</div>
              <div class="wf-node-model">${esc(modelLabel)}</div>
            </div>`;
          });
          g += '</div>';
          if (di < layers.length - 1) {
            // Arrow between layers
            const nextLayer = layers[di + 1];
            const isJoin = nextLayer.length === 1 && layer.length > 1 && nextLayer[0].needs && nextLayer[0].needs.length > 1;
            g += `<div class="wf-arrow">${isJoin ? '&#9660; join' : '&#9660;'}</div>`;
          }
        });
        g += '</div>';
        graphHtml = g;
      }

      let inputHtml = '';
      if (isAgent) {
        inputHtml = `<div class="compose-input-wrap">
            <textarea class="compose-textarea" id="compose-text" placeholder="Message ${esc(name)}..." rows="1"></textarea>
            <button class="compose-send" id="compose-btn" title="Send (Enter)">&#9654;</button>
          </div>
          <div class="compose-hint">Enter to send, Shift+Enter for newline</div>`;
      } else {
        const vars = card.variables || [];
        let varsHtml = '';
        for (let i = 0; i < vars.length; i++) {
          const v = vars[i];
          const isLast = i === vars.length - 1;
          varsHtml += `<div style="display:flex;align-items:center;gap:8px">
            <label style="font-size:12px;font-weight:500;color:var(--text-sec);min-width:80px">${esc(v)}</label>
            <div style="flex:1;position:relative">
              <input type="text" class="compose-var" data-var="${esc(v)}" placeholder="${esc(v)}" style="width:100%;padding:8px 10px;${isLast ? 'padding-right:42px;' : ''}border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--sans);outline:none;color:var(--text);transition:border-color .15s">
              ${isLast ? '<button class="compose-send" id="compose-btn" title="Send (Enter)" style="position:absolute;right:4px;top:50%;transform:translateY(-50%)">&#9654;</button>' : ''}
            </div>
          </div>`;
        }
        if (vars.length === 0) {
          varsHtml = `<div><button class="compose-send" id="compose-btn" title="Run workflow" style="position:static;width:auto;padding:8px 20px;font-size:12px;border-radius:6px">Run &#9654;</button></div>`;
        }
        inputHtml = `<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">${varsHtml}</div>
          <div class="compose-hint" style="margin-top:8px">Enter to run</div>`;
      }

      area.innerHTML = `<div class="compose-view">
        <div class="compose-card">
          <div class="compose-card-hdr">
            <div><span class="compose-card-name">${esc(name)}</span><span class="compose-card-type">${typeBadge}</span></div>
            ${desc ? `<div class="compose-card-desc">${esc(desc)}</div>` : ''}
            ${propsHtml ? `<div class="compose-card-props">${propsHtml}</div>` : ''}
          </div>
          ${graphHtml}
          ${inputHtml}
        </div>
      </div>`;

      const textarea = document.getElementById('compose-text');
      const btn = document.getElementById('compose-btn');

      if (textarea) {
        textarea.addEventListener('input', () => {
          textarea.style.height = 'auto';
          textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        });
        textarea.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitCompose(); }
        });
        textarea.focus();
      }
      if (btn) btn.addEventListener('click', submitCompose);

      // Enter to submit from var inputs, focus styling
      area.querySelectorAll('.compose-var').forEach(inp => {
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); submitCompose(); }
        });
        inp.addEventListener('focus', () => { inp.style.borderColor = 'var(--blue)'; inp.style.boxShadow = '0 0 0 3px rgba(37,99,235,.08)'; });
        inp.addEventListener('blur', () => { inp.style.borderColor = 'var(--border)'; inp.style.boxShadow = 'none'; });
      });
      const firstInput = area.querySelector('.compose-var');
      if (firstInput && !textarea) firstInput.focus();
    }

    function submitCompose() {
      const textarea = document.getElementById('compose-text');
      let text = textarea ? textarea.value.trim() : '';
      const t = state.composeTarget;
      if (!t || !mqttClient || !state.connected) return;
      if (t.type === 'agent' && !text) return; // agents need a prompt

      const sid = 'dash-' + crypto.randomUUID().slice(0, 8);
      const replyTopic = `$a2a/v1/reply/skitter/default/dashboard/${crypto.randomUUID().slice(0,8)}`;
      const vars = {};
      document.querySelectorAll('.compose-var').forEach(inp => {
        if (inp.value.trim()) vars[inp.dataset.var] = inp.value.trim();
      });

      const msg = { sender: 'dashboard', session_id: sid, timestamp: Date.now() / 1000 };

      if (t.type === 'agent') {
        msg.agent_id = t.id;
        msg.text = text;
      } else {
        msg.workflow_id = t.id;
        if (Object.keys(vars).length) msg.workflow_vars = vars;
        const varSummary = Object.values(vars).join(', ');
        msg.text = text || (varSummary ? `${t.id}: ${varSummary}` : t.id);
      }

      mqttClient.publish('$a2a/v1/request/skitter/default/gateway', JSON.stringify(msg), {
        qos: 1, properties: { responseTopic: replyTopic, correlationData: new TextEncoder().encode(sid) },
      });

      state.selectedSessionId = sid;
      state.composeTarget = null;
      // Switch to sessions tab
      document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('active'));
      document.querySelector('.side-tab[data-tab="sessions"]').classList.add('active');
      document.getElementById('panel-sessions').classList.add('active');
      renderAll();
    }

    function renderTasks() {
      const area = document.getElementById('task-area');
      const s = state.sessions.get(state.selectedSessionId);
      if (!s) { renderComposeView(); return; }

      const sid = state.selectedSessionId;
      // Merge per-task status from retained topics over session's embedded status
      const tasks = Object.values(s.tasks).map(t => {
        const ts = state.taskStatus.get(`${sid}/${t.task_id}`);
        return ts ? { ...t, status: ts } : t;
      });
      const pending = tasks.filter(t => t.status === 'pending' || t.status === 'waiting');
      const running = tasks.filter(t => t.status === 'running');
      const done = tasks.filter(t => t.status === 'done');

      function card(t) {
        const sel = t.id === state.selectedTaskId;
        let workerDot = '', streamInd = '', preview = '';
        if (t.status === 'running') {
          const ws = state.workerStatus.get(`${sid}/${t.task_id}`);
          if (ws === 'alive') workerDot = '<span class="worker-dot alive"></span>';
          else if (ws === 'dead') workerDot = '<span class="worker-dot dead"></span>';
          const hasChunks = state.streamChunks.has(`${sid}/${t.task_id}`);
          if (hasChunks) {
            streamInd = '<span class="stream-dot"></span> ';
            const lt = latestStream(sid, t);
            if (lt) preview = `<div class="card-preview">${esc(trunc(lt, 60))}</div>`;
          }
        }
        if (t.status === 'done' && !preview) {
          const tr = state.taskResults.get(`${sid}/${t.task_id}`);
          if (tr) preview = `<div class="card-preview">${esc(trunc(tr, 60))}</div>`;
        }
        const usage = state.taskUsage.get(`${sid}/${t.task_id}`);
        let foot = '<div class="card-foot">';
        if (usage && usage.usage) foot += `<span class="card-tokens">${fmtTok((usage.usage.input_tokens||0)+(usage.usage.output_tokens||0))} tok</span>`;
        if (usage && usage.cost_usd != null) foot += `<span class="card-cost">$${usage.cost_usd.toFixed(4)}</span>`;
        if (t.status === 'running') foot += `<button class="stop-btn" onclick="event.stopPropagation();cancelTask('${esc(sid)}','${esc(t.task_id)}')">Stop</button>`;
        foot += '</div>';

        return `<div class="card ${t.status}${sel ? ' selected' : ''}" data-tid="${esc(t.id)}">
          <div class="card-top"><span class="card-id">${streamInd}${esc(t.id)}</span>${t.model ? `<span class="card-model">${esc(t.model)}</span>` : ''}</div>
          <div class="card-agent">${workerDot}${esc(t.agent)}</div>
          <div class="card-desc">${esc(trunc(t.description, 100))}</div>
          ${preview}${foot}
        </div>`;
      }

      let resultHtml = '';
      const sessionResult = getSessionResult();
      if (sessionResult) {
        resultHtml = `<div class="session-result">
          <div class="session-result-hdr">Result<span class="result-actions"><button class="result-act" onclick="copyResult()">Copy</button><button class="result-act" onclick="downloadResult()">Download</button></span></div>
          <div class="session-result-text">${marked.parse(sessionResult)}</div>
        </div>`;
      }

      area.innerHTML = `${resultHtml}<div class="task-grid">
        <div><div class="col-hdr"><span class="col-dot pending"></span><h3>Pending</h3><span class="cnt">${pending.length}</span></div><div class="task-col">${pending.map(card).join('')}</div></div>
        <div><div class="col-hdr"><span class="col-dot running"></span><h3>Running</h3><span class="cnt">${running.length}</span></div><div class="task-col">${running.map(card).join('')}</div></div>
        <div><div class="col-hdr"><span class="col-dot done"></span><h3>Done</h3><span class="cnt">${done.length}</span></div><div class="task-col">${done.map(card).join('')}</div></div>
      </div>`;

      area.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
        state.selectedTaskId = c.dataset.tid; renderTaskSelection(); renderDetail();
      }));
      renderTaskSelection();
    }

    function renderTaskSelection() {
      document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.tid === state.selectedTaskId));
    }

    function renderDetail() {
      const panel = document.getElementById('detail');
      const inner = document.getElementById('detail-inner');
      const s = state.sessions.get(state.selectedSessionId);
      if (!s || !state.selectedTaskId) { panel.classList.remove('open'); return; }
      const t = s.tasks[state.selectedTaskId];
      if (!t) { panel.classList.remove('open'); return; }
      panel.classList.add('open');

      const sid = state.selectedSessionId;
      const mergedStatus = state.taskStatus.get(`${sid}/${t.task_id}`) || t.status;
      const result = state.taskResults.get(`${sid}/${t.task_id}`) || null;
      const stopBtn = mergedStatus === 'running' ? `<button class="stop-btn" onclick="cancelTask('${esc(sid)}','${esc(t.task_id)}')">Stop</button>` : '';

      let h = `<div class="det-hdr">
        <h2>${esc(t.id)}</h2>
        <span class="config-badge">${esc(t.agent)}</span>
        ${t.model ? `<span class="card-model">${esc(t.model)}</span>` : ''}
        <span class="badge-status ${mergedStatus}">${esc(mergedStatus)}</span>
        ${stopBtn}
        <button class="det-close det-expand" onclick="toggleExpand()">Expand</button>
        <button class="det-close" onclick="closeDetail()">Close</button>
      </div>`;

      h += `<div class="det-section"><div class="det-label">Description</div><div class="det-text">${esc(t.description)}</div></div>`;

      // Stream log (live while running, full log when done)
      const chunks = state.streamChunks.get(`${sid}/${t.task_id}`);
      if (chunks && chunks.length) {
        const isRunning = mergedStatus === 'running';
        let sh = '';
        for (const c of chunks.slice(isRunning ? -50 : -200)) {
          if (c.type === 'text') sh += esc(c.content);
          else if (c.type === 'tool_use') sh += `<span class="tool">[${esc(c.content)}]</span>\n`;
          else if (c.type === 'tool_result') sh += `<span class="tool">  \u2192 ${esc(trunc(c.content, 150))}</span>\n`;
          else if (c.type === 'error') sh += `<span class="err">[ERROR: ${esc(c.content)}]</span>\n`;
        }
        const label = isRunning ? '<span class="stream-dot"></span> Live Output' : 'Activity Log';
        h += `<div class="det-section"><div class="det-label">${label}</div><div class="det-stream">${sh}</div></div>`;
      }

      if (result) h += `<div class="det-section"><div class="det-label">Result</div><div class="det-box"><div class="det-result-md">${marked.parse(result)}</div></div><div class="det-result-actions"><button class="det-act" onclick="copyTaskResult()">Copy</button><button class="det-act" onclick="downloadTaskResult()">Download</button></div></div>`;

      if (t.needs && t.needs.length) {
        h += `<div class="det-section"><div class="det-label">Dependencies</div><div class="det-deps">${t.needs.map(d => `<span class="dep-tag" data-dep="${esc(d)}">${esc(d)}</span>`).join('')}</div></div>`;
      }

      const usage = state.taskUsage.get(`${sid}/${t.task_id}`);
      if (usage && usage.usage) {
        const u = usage.usage;
        h += `<div class="det-section"><div class="det-label">Usage</div><div class="det-usage">
          <div class="ustat"><div class="ustat-label">Input</div><div class="ustat-val">${fmtTok(u.input_tokens)}</div></div>
          <div class="ustat"><div class="ustat-label">Output</div><div class="ustat-val">${fmtTok(u.output_tokens)}</div></div>
          <div class="ustat"><div class="ustat-label">Cache Read</div><div class="ustat-val">${fmtTok(u.cache_read_input_tokens)}</div></div>
          <div class="ustat"><div class="ustat-label">Cache Write</div><div class="ustat-val">${fmtTok(u.cache_creation_input_tokens)}</div></div>
          ${usage.cost_usd != null ? `<div class="ustat"><div class="ustat-label">Cost</div><div class="ustat-val cost">$${usage.cost_usd.toFixed(4)}</div></div>` : ''}
        </div></div>`;
      }

      h += `<div class="det-section"><div class="det-meta">task_id: ${esc(t.task_id)}</div></div>`;
      inner.innerHTML = h;

      // Sync expand button text
      const expBtn = inner.querySelector('.det-expand');
      if (expBtn) expBtn.textContent = panel.classList.contains('expanded') ? 'Collapse' : 'Expand';

      inner.querySelectorAll('.dep-tag').forEach(tag => tag.addEventListener('click', () => {
        state.selectedTaskId = tag.dataset.dep; renderTaskSelection(); renderDetail();
      }));
    }

    function closeDetail() { state.selectedTaskId = null; const d = document.getElementById('detail'); d.classList.remove('open', 'expanded'); renderTaskSelection(); }
    function toggleExpand() {
      const d = document.getElementById('detail');
      d.classList.toggle('expanded');
      const btn = d.querySelector('.det-expand');
      if (btn) btn.textContent = d.classList.contains('expanded') ? 'Collapse' : 'Expand';
    }

    function getSessionResult() {
      const s = state.sessions.get(state.selectedSessionId);
      if (!s) return '';
      // Session result from immutable spec
      if (s.result) return s.result;
      // Derive from terminal task's per-task result
      const sid = state.selectedSessionId;
      const terminal = Object.values(s.tasks).find(t => t.next === 'output');
      if (terminal) {
        const r = state.taskResults.get(`${sid}/${terminal.task_id}`);
        if (r) return r;
      }
      return '';
    }
    function getSelectedTaskResult() {
      const s = state.sessions.get(state.selectedSessionId);
      if (!s || !state.selectedTaskId) return '';
      const t = s.tasks[state.selectedTaskId];
      if (!t) return '';
      return state.taskResults.get(`${state.selectedSessionId}/${t.task_id}`) || '';
    }
    function copyTaskResult() {
      const md = getSelectedTaskResult();
      if (!md) return;
      navigator.clipboard.writeText(md).then(() => {
        const btn = document.querySelector('.det-act');
        if (btn) { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); }
      });
    }
    function downloadTaskResult() {
      const md = getSelectedTaskResult();
      if (!md) return;
      const name = state.selectedTaskId || 'result';
      const blob = new Blob([md], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${name}.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function copyResult() {
      const md = getSessionResult();
      if (!md) return;
      navigator.clipboard.writeText(md).then(() => {
        const btn = document.querySelector('.result-act');
        if (btn) { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); }
      });
    }
    function downloadResult() {
      const md = getSessionResult();
      if (!md) return;
      const sid = state.selectedSessionId || 'result';
      const blob = new Blob([md], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${sid}.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function renderAll() { renderSessions(); renderAgents(); renderWorkflows(); renderHeader(); renderTasks(); renderDetail(); }

    // --- Tab switching ---
    document.querySelectorAll('.side-tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    }));

    // --- Init ---
    connect();
    renderAll();
  </script>
</body>
</html>
