<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skitter Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════
       Variables
       ═══════════════════════════════════════════ */
    :root {
      --bg-deep: #060a10;
      --bg-base: #0a1018;
      --bg-surface: #101822;
      --bg-elevated: #16202e;
      --bg-card: #1a2536;
      --bg-card-hover: #1f2d42;
      --border-subtle: #1a2536;
      --border-default: #263348;
      --border-strong: #3a4d66;
      --text-primary: #e8edf4;
      --text-secondary: #8a99b0;
      --text-muted: #556378;
      --status-pending: #556378;
      --status-running: #3b82f6;
      --status-done: #0fd492;
      --status-error: #ef4444;
      --accent-cyan: #22d3ee;
      --accent-amber: #f59e0b;
      --font-display: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-w: 280px;
      --header-h: 56px;
    }

    /* ═══════════════════════════════════════════
       Reset & Base
       ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-deep);
      background-image: radial-gradient(circle, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 20px 20px;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

    /* ═══════════════════════════════════════════
       Layout
       ═══════════════════════════════════════════ */
    #app { display: flex; flex-direction: column; height: 100vh; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-base);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════
       Accent Line
       ═══════════════════════════════════════════ */
    #accent-line {
      height: 2px;
      flex-shrink: 0;
      background: linear-gradient(90deg, var(--bg-deep), var(--accent-cyan), var(--status-running), var(--accent-cyan), var(--bg-deep));
      background-size: 200% 100%;
      animation: gradient-shift 6s linear infinite;
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* ═══════════════════════════════════════════
       Header
       ═══════════════════════════════════════════ */
    header {
      height: var(--header-h);
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: baseline; gap: 12px; }
    .header-left h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.12em;
      color: var(--text-primary);
    }
    .header-left .mark {
      color: var(--accent-cyan);
      font-size: 14px;
      margin-right: 2px;
    }
    .header-left .subtitle {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    .header-right { display: flex; align-items: center; gap: 16px; }
    #clock {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .conn-status { display: flex; align-items: center; gap: 8px; }
    #conn-label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--status-error);
      transition: color 0.3s;
    }
    #conn-label.connected { color: var(--status-done); }
    #conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-error);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #conn-dot.connected {
      background: var(--status-done);
      box-shadow: 0 0 6px var(--status-done), 0 0 14px rgba(15, 212, 146, 0.25);
      animation: conn-pulse 2.5s ease-in-out infinite;
    }
    @keyframes conn-pulse {
      0%, 100% { box-shadow: 0 0 6px var(--status-done), 0 0 14px rgba(15, 212, 146, 0.25); }
      50% { box-shadow: 0 0 8px var(--status-done), 0 0 20px rgba(15, 212, 146, 0.35); }
    }

    /* ═══════════════════════════════════════════
       Sidebar — Session List
       ═══════════════════════════════════════════ */
    .sidebar-section { display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-section:first-child { flex-shrink: 0; max-height: 40%; }
    .sidebar-section:last-child { flex: 1; }
    .sidebar-header {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 14px 16px 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .session-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    .session-entry {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .session-entry:hover { background: var(--bg-surface); }
    .session-entry.active {
      background: var(--bg-surface);
      border-left-color: var(--accent-cyan);
    }
    .session-id {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .session-status-dot.active { background: var(--status-running); animation: session-dot-pulse 2s ease-in-out infinite; }
    .session-status-dot.done { background: var(--status-done); }
    @keyframes session-dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .session-text {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ═══════════════════════════════════════════
       Sidebar — Chat Messages
       ═══════════════════════════════════════════ */
    #chat-log { overflow-y: auto; flex: 1; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
    .chat-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 11px;
      font-style: italic;
    }
    .chat-msg {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      max-width: 92%;
      word-wrap: break-word;
    }
    .chat-msg.in {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .chat-msg.out {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.15);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .chat-msg .msg-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .chat-msg .msg-meta { display: flex; align-items: center; gap: 6px; }
    .chat-msg .msg-text { color: var(--text-primary); white-space: pre-wrap; }
    .msg-download {
      background: none;
      border: 1px solid var(--border-default);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      transition: all 0.15s;
      margin-left: auto;
    }
    .msg-download:hover { background: var(--bg-elevated); color: var(--text-secondary); }

    /* ═══════════════════════════════════════════
       Sidebar — Compose
       ═══════════════════════════════════════════ */
    .sidebar-compose {
      flex-shrink: 0;
      border-top: 1px solid var(--border-default);
      padding: 10px 12px;
      background: var(--bg-surface);
    }
    .sidebar-compose.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .compose-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .compose-header span {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    #new-session-btn {
      background: none;
      border: 1px solid var(--border-default);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 13px;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    #new-session-btn:hover {
      background: var(--bg-elevated);
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }
    #compose-target {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 8px;
      outline: none;
      cursor: pointer;
      margin-bottom: 4px;
      transition: border-color 0.15s;
    }
    #compose-target:focus { border-color: var(--accent-cyan); }
    .compose-input-wrap {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    #compose-input {
      flex: 1;
      background: var(--bg-deep);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.4;
      padding: 8px 10px;
      resize: vertical;
      min-height: 36px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.15s;
    }
    #compose-input::placeholder { color: var(--text-muted); }
    #compose-input:focus { border-color: var(--accent-cyan); }
    #compose-send {
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.25);
      color: var(--accent-cyan);
      font-size: 14px;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    #compose-send:hover {
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--accent-cyan);
    }

    /* ═══════════════════════════════════════════
       Kanban
       ═══════════════════════════════════════════ */
    #kanban-wrapper {
      position: relative;
      flex: 1;
      overflow: auto;
      padding: 16px 20px;
    }
    #dag-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    #kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      min-height: 100%;
      position: relative;
      z-index: 1;
    }
    .kanban-column {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }
    .column-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .column-header h3 {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      flex: 1;
    }
    .column-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .column-dot.pending { background: var(--status-pending); }
    .column-dot.running { background: var(--status-running); }
    .column-dot.done { background: var(--status-done); }
    .column-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 1px 7px;
      border-radius: 10px;
    }
    .column-body { padding: 8px; flex: 1; display: flex; flex-direction: column; gap: 8px; }

    /* ═══════════════════════════════════════════
       Task Cards
       ═══════════════════════════════════════════ */
    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--status-pending);
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .task-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-default);
    }
    .task-card.selected {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 1px var(--accent-cyan), 0 0 12px rgba(34, 211, 238, 0.08);
    }
    .task-card.status-running {
      border-left-color: var(--status-running);
      animation: card-glow 2.5s ease-in-out infinite;
    }
    .task-card.status-done { border-left-color: var(--status-done); }
    @keyframes card-glow {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: inset 0 0 12px rgba(59, 130, 246, 0.06); }
    }
    .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .card-logical-id {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-model {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-cyan);
      border: 1px solid rgba(34, 211, 238, 0.15);
      flex-shrink: 0;
    }
    .card-agent {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .worker-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .worker-dot.alive { background: var(--status-done); animation: worker-pulse 1.5s ease-in-out infinite; }
    .worker-dot.dead { background: var(--status-error); }
    .worker-dot.wdone { background: var(--text-muted); }
    @keyframes worker-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .stream-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-running);
      animation: stream-pulse 1s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes stream-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }
    .card-stream-preview {
      font-size: 10px;
      line-height: 1.35;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
      padding: 2px 6px;
      background: var(--bg-deep);
      border-radius: 3px;
      border: 1px solid var(--border-subtle);
    }
    .stop-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--status-error);
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .stop-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .stop-all-btn {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--status-error);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      margin-left: auto;
    }
    .stop-all-btn:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
    }
    .detail-stream-output {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px 14px;
      max-height: 250px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .detail-stream-output .chunk-tool {
      color: var(--accent-cyan);
      opacity: 0.8;
    }
    .detail-stream-output .chunk-error {
      color: var(--status-error);
    }
    .detail-stream-meta {
      display: flex;
      gap: 12px;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .detail-stream-meta .val { color: var(--text-secondary); font-weight: 500; }
    .card-desc {
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
    }
    .card-tokens {
      color: var(--text-muted);
      margin-left: auto;
    }
    .card-cost {
      color: var(--accent-amber);
    }

    /* ═══════════════════════════════════════════
       Kanban Empty State
       ═══════════════════════════════════════════ */
    .kanban-empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--text-muted);
      gap: 10px;
    }
    .kanban-empty .empty-icon { font-size: 28px; opacity: 0.3; }
    .kanban-empty .empty-text {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.06em;
    }
    .kanban-empty .empty-hint { font-size: 11px; opacity: 0.6; }

    /* ═══════════════════════════════════════════
       Detail Panel
       ═══════════════════════════════════════════ */
    #detail-panel {
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-base);
      overflow-y: auto;
      flex-shrink: 0;
      max-height: 45vh;
      transition: max-height 0.25s ease;
    }
    #detail-panel.hidden { max-height: 0; border-top-color: transparent; }
    #detail-inner { padding: 16px 20px; }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .detail-header h2 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }
    .detail-badge {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .detail-badge.agent { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-default); }
    .detail-badge.model { background: rgba(34, 211, 238, 0.1); color: var(--accent-cyan); border: 1px solid rgba(34, 211, 238, 0.15); }
    .detail-badge.status-pending { background: rgba(85, 99, 120, 0.15); color: var(--status-pending); border: 1px solid rgba(85, 99, 120, 0.2); }
    .detail-badge.status-running { background: rgba(59, 130, 246, 0.12); color: var(--status-running); border: 1px solid rgba(59, 130, 246, 0.2); }
    .detail-badge.status-done { background: rgba(15, 212, 146, 0.1); color: var(--status-done); border: 1px solid rgba(15, 212, 146, 0.15); }
    .detail-close {
      margin-left: auto;
      background: none;
      border: 1px solid var(--border-default);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .detail-close:hover { background: var(--bg-elevated); color: var(--text-secondary); }
    .detail-section { margin-bottom: 14px; }
    .detail-section-label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .detail-text {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .detail-result-box {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 12px 14px;
      max-height: 200px;
      overflow-y: auto;
    }
    .detail-deps { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-dep-tag {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .detail-dep-tag:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .detail-meta {
      display: flex;
      gap: 20px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .detail-usage {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .usage-stat {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .usage-stat .stat-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .usage-stat .stat-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .usage-stat .stat-value.cost { color: var(--accent-amber); }
    .job-usage-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px 8px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .job-usage-bar span { display: flex; align-items: center; gap: 4px; }
    .job-usage-bar .val { color: var(--text-secondary); font-weight: 500; }

    /* ═══════════════════════════════════════════
       Responsive
       ═══════════════════════════════════════════ */
    @media (max-width: 768px) {
      #sidebar { display: none; }
      :root { --sidebar-w: 0px; }
      #kanban { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="accent-line"></div>
    <header>
      <div class="header-left">
        <h1><span class="mark">&#9670;</span>SKITTER</h1>
        <span class="subtitle">MQTT Agent Orchestrator</span>
      </div>
      <div class="header-right">
        <span id="clock"></span>
        <div class="conn-status">
          <span id="conn-label">DISCONNECTED</span>
          <span id="conn-dot"></span>
        </div>
      </div>
    </header>

    <div id="main">
      <aside id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-header">Sessions</div>
          <div class="session-list" id="session-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-header">Messages</div>
          <div id="chat-log"></div>
        </div>
        <div class="sidebar-compose disabled" id="compose-bar">
          <div class="compose-header">
            <span>New Request</span>
            <button id="new-session-btn" title="Start new session">+</button>
          </div>
          <select id="compose-target"></select>
          <div class="compose-input-wrap">
            <textarea id="compose-input" placeholder="Prompt... (or /agent id prompt, /pipeline id --var k=v)" rows="2"></textarea>
            <button id="compose-send" title="Send (Enter)">&#9654;</button>
          </div>
        </div>
      </aside>

      <div id="content">
        <div id="kanban-wrapper">
          <svg id="dag-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="kanban"></div>
        </div>
        <div id="detail-panel" class="hidden">
          <div id="detail-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       Constants
       ═══════════════════════════════════════════ */
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const BROKER_URL = 'ws://localhost:8083/mqtt';

    /* ═══════════════════════════════════════════
       State
       ═══════════════════════════════════════════ */
    const state = {
      connected: false,
      jobs: new Map(),
      taskResults: new Map(),
      workerStatus: new Map(),
      taskUsage: new Map(),    // "chat_id/task_id" -> {usage, cost_usd}
      streamChunks: new Map(), // "chat_id/task_id" -> [{seq, type, content}]
      agentCards: new Map(),   // agent_id -> {name, description, model, ...}
      chatMessages: [],
      selectedChatId: null,
      selectedTaskId: null,
    };
    let mqttClient = null;
    let streamRenderPending = false;

    /* ═══════════════════════════════════════════
       Utilities
       ═══════════════════════════════════════════ */
    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function truncate(str, n) {
      if (!str) return '';
      return str.length > n ? str.slice(0, n) + '\u2026' : str;
    }

    function formatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function getResultForTask(chatId, task) {
      const job = state.jobs.get(chatId);
      if (job && job.results && job.results[task.logical_id]) {
        return job.results[task.logical_id];
      }
      return state.taskResults.get(`${chatId}/${task.task_id}`) || null;
    }

    function jobIsActive(job) {
      return Object.values(job.tasks).some(t => t.status !== 'done');
    }

    function fmtTokens(n) {
      if (n == null) return '?';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    function getUsageForTask(chatId, task) {
      return state.taskUsage.get(`${chatId}/${task.task_id}`) || null;
    }

    function scheduleStreamRender() {
      if (!streamRenderPending) {
        streamRenderPending = true;
        setTimeout(() => {
          renderKanban();
          renderDetail();
          streamRenderPending = false;
        }, 500);
      }
    }

    function getLatestStreamText(chatId, task) {
      const key = `${chatId}/${task.task_id}`;
      const chunks = state.streamChunks.get(key);
      if (!chunks || chunks.length === 0) return null;
      // Find last text chunk
      for (let i = chunks.length - 1; i >= 0; i--) {
        if (chunks[i].type === 'text') return chunks[i].content;
      }
      // Fall back to last chunk of any type
      return chunks[chunks.length - 1].content;
    }

    function publishCancel(chatId, taskId, reason) {
      if (!mqttClient || !state.connected) return;
      // Look up the agent for this task from the job spec
      const job = state.jobs.get(chatId);
      if (!job) return;
      const task = Object.values(job.tasks).find(t => t.task_id === taskId);
      if (!task) return;
      const org = 'skitter', unit = 'default';
      const topic = `$a2a/v1/request/${org}/${unit}/${task.agent}/cancel`;
      const payload = JSON.stringify({
        jsonrpc: '2.0',
        method: 'tasks/cancel',
        params: { task_id: taskId, reason: reason || 'User cancelled from dashboard' },
        id: crypto.randomUUID(),
      });
      mqttClient.publish(topic, payload, { qos: 1 });
    }

    function publishCancelAll(chatId) {
      const job = state.jobs.get(chatId);
      if (!job) return;
      for (const task of Object.values(job.tasks)) {
        if (task.status === 'running') {
          publishCancel(chatId, task.task_id, 'User stopped all tasks');
        }
      }
    }

    function getJobUsageTotals(chatId) {
      const job = state.jobs.get(chatId);
      if (!job) return null;
      let totalIn = 0, totalOut = 0, totalCost = 0, count = 0;
      for (const task of Object.values(job.tasks)) {
        const u = state.taskUsage.get(`${chatId}/${task.task_id}`);
        if (u && u.usage) {
          totalIn += (u.usage.input_tokens || 0);
          totalOut += (u.usage.output_tokens || 0);
          if (u.cost_usd != null) totalCost += u.cost_usd;
          count++;
        }
      }
      return count ? { input_tokens: totalIn, output_tokens: totalOut, cost_usd: totalCost } : null;
    }

    /* ═══════════════════════════════════════════
       MQTT
       ═══════════════════════════════════════════ */
    function connect() {
      mqttClient = mqtt.connect(BROKER_URL, {
        protocolVersion: 5,
        reconnectPeriod: 3000,
        connectTimeout: 5000,
        clean: true,
      });

      mqttClient.on('connect', () => {
        state.connected = true;
        renderConnectionStatus();
        mqttClient.subscribe('$a2a/v1/#', { qos: 1 });
      });

      mqttClient.on('close', () => {
        state.connected = false;
        renderConnectionStatus();
      });

      mqttClient.on('error', (err) => console.error('MQTT:', err));
      mqttClient.on('message', onMessage);
    }

    function onMessage(topic, payload) {
      const raw = payload.toString();
      const parts = topic.split('/');
      // A2A topics: $a2a/v1/{category}/{org}/{unit}/...

      // $a2a/v1/state/{org}/{unit}/jobs/{chat_id}
      if (parts[2] === 'state' && parts[5] === 'jobs' && parts.length === 7) {
        const chatId = parts[6];
        if (!raw) {
          state.jobs.delete(chatId);
          if (state.selectedChatId === chatId) {
            state.selectedTaskId = null;
          }
        } else {
          try { state.jobs.set(chatId, JSON.parse(raw)); } catch(e) { return; }
          if (!state.selectedChatId) state.selectedChatId = chatId;
        }
        renderAll();
        return;
      }

      // $a2a/v1/event/{org}/{unit}/workers/{task_id}
      if (parts[2] === 'event' && parts[5] === 'workers' && parts.length === 7) {
        if (raw) {
          try {
            const s = JSON.parse(raw);
            // Find chat_id from jobs
            let chatIdForTask = null;
            for (const [cid, job] of state.jobs) {
              for (const t of Object.values(job.tasks)) {
                if (t.task_id === parts[6]) { chatIdForTask = cid; break; }
              }
              if (chatIdForTask) break;
            }
            if (chatIdForTask) {
              state.workerStatus.set(`${chatIdForTask}/${parts[6]}`, s.status);
            }
          } catch(e) {}
        }
        renderKanban();
        return;
      }

      // $a2a/v1/state/{org}/{unit}/usage/{chat_id}/{task_id}
      if (parts[2] === 'state' && parts[5] === 'usage' && parts.length === 8 && raw) {
        try {
          const msg = JSON.parse(raw);
          state.taskUsage.set(`${parts[6]}/${parts[7]}`, { usage: msg.usage, cost_usd: msg.cost_usd });
        } catch(e) {}
        renderKanban();
        renderDetail();
        return;
      }

      // $a2a/v1/reply/{org}/{unit}/{agent_id}/{suffix} — stream items and results
      if (parts[2] === 'reply' && raw) {
        try {
          const msg = JSON.parse(raw);
          // StreamItem (has seq + type)
          if (msg.seq != null && msg.type) {
            const taskId = msg.task_id;
            // Find chat_id from jobs
            let chatIdForTask = null;
            for (const [cid, job] of state.jobs) {
              for (const t of Object.values(job.tasks)) {
                if (t.task_id === taskId) { chatIdForTask = cid; break; }
              }
              if (chatIdForTask) break;
            }
            if (chatIdForTask) {
              const key = `${chatIdForTask}/${taskId}`;
              if (!state.streamChunks.has(key)) state.streamChunks.set(key, []);
              const chunks = state.streamChunks.get(key);
              chunks.push(msg);
              if (chunks.length > 200) chunks.splice(0, chunks.length - 200);
            }
            scheduleStreamRender();
            return;
          }
          // TaskStatusUpdate (has state + task_id)
          if (msg.state && msg.task_id) {
            let chatIdForTask = null;
            for (const [cid, job] of state.jobs) {
              for (const t of Object.values(job.tasks)) {
                if (t.task_id === msg.task_id) { chatIdForTask = cid; break; }
              }
              if (chatIdForTask) break;
            }
            if (chatIdForTask) {
              state.taskResults.set(`${chatIdForTask}/${msg.task_id}`, msg.result);
            }
            renderDetail();
            return;
          }
        } catch(e) {}
        return;
      }

      // $a2a/v1/discovery/{org}/{unit}/{agent_id} — Agent Cards
      if (parts[2] === 'discovery' && raw) {
        try {
          const card = JSON.parse(raw);
          if (card.agent_id && card.agent_id !== 'coordinator') {
            state.agentCards.set(card.agent_id, card);
            renderComposeSelector();
          }
        } catch(e) {}
        return;
      }

      // $a2a/v1/request/{org}/{unit}/coordinator — inbound requests
      if (parts[2] === 'request' && parts[5] === 'coordinator' && parts.length === 6 && raw) {
        try {
          const msg = JSON.parse(raw);
          if (msg.chat_id && msg.text) {
            state.chatMessages.push({ direction: 'in', chat_id: msg.chat_id, text: msg.text, timestamp: msg.timestamp || Date.now()/1000 });
            if (!state.selectedChatId) state.selectedChatId = msg.chat_id;
          }
        } catch(e) {}
        renderChatPanel();
        renderSessionList();
        return;
      }
    }

    /* ═══════════════════════════════════════════
       Render — Connection & Clock
       ═══════════════════════════════════════════ */
    function renderConnectionStatus() {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      if (state.connected) {
        dot.className = 'connected';
        label.className = 'connected';
        label.textContent = 'CONNECTED';
      } else {
        dot.className = '';
        label.className = '';
        label.textContent = 'DISCONNECTED';
      }
      updateComposeState();
    }

    function renderClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }

    /* ═══════════════════════════════════════════
       Render — Session List
       ═══════════════════════════════════════════ */
    function renderSessionList() {
      const el = document.getElementById('session-list');
      const chatIds = new Set();
      for (const id of state.jobs.keys()) chatIds.add(id);
      for (const m of state.chatMessages) chatIds.add(m.chat_id);

      if (chatIds.size === 0) {
        el.innerHTML = '<div class="chat-empty">No sessions</div>';
        return;
      }

      let html = '';
      for (const cid of chatIds) {
        const job = state.jobs.get(cid);
        const active = job && jobIsActive(job);
        const selected = cid === state.selectedChatId;
        const text = job ? job.original_text : '';
        html += `<div class="session-entry${selected ? ' active' : ''}" data-chat-id="${esc(cid)}">
          <div class="session-id">
            <span class="session-status-dot ${active ? 'active' : 'done'}"></span>
            ${esc(cid.slice(0, 10))}
          </div>
          <div class="session-text">${esc(truncate(text, 50))}</div>
        </div>`;
      }
      el.innerHTML = html;

      el.querySelectorAll('.session-entry').forEach(entry => {
        entry.addEventListener('click', () => {
          state.selectedChatId = entry.dataset.chatId;
          state.selectedTaskId = null;
          renderAll();
        });
      });
    }

    /* ═══════════════════════════════════════════
       Render — Chat Messages
       ═══════════════════════════════════════════ */
    function renderChatPanel() {
      const el = document.getElementById('chat-log');
      const msgs = state.chatMessages.filter(m => m.chat_id === state.selectedChatId);

      if (msgs.length === 0) {
        el.innerHTML = '<div class="chat-empty">No messages yet</div>';
        return;
      }

      let html = '';
      for (const m of msgs) {
        const dir = m.direction === 'in' ? 'in' : 'out';
        const label = m.direction === 'in' ? 'USER' : 'SKITTER';
        const dlBtn = dir === 'out' ? `<button class="msg-download" onclick="downloadReport('${m.chat_id}', this)" title="Download as Markdown">&#8615;</button>` : '';
        html += `<div class="chat-msg ${dir}">
          <div class="msg-meta">${label} &middot; ${formatTime(m.timestamp)}${dlBtn}</div>
          <div class="msg-text">${esc(m.text)}</div>
        </div>`;
      }
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    function downloadReport(chatId, btn) {
      const textEl = btn.closest('.chat-msg').querySelector('.msg-text');
      const text = textEl.textContent;
      const blob = new Blob([text], { type: 'text/markdown' });
      const ts = new Date().toISOString().replace(/[-:T]/g, m => m === 'T' ? '-' : '').slice(0, 15);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `skitter-${chatId}-${ts}.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    /* ═══════════════════════════════════════════
       Render — Kanban Board
       ═══════════════════════════════════════════ */
    function renderKanban() {
      const kanban = document.getElementById('kanban');
      const job = state.jobs.get(state.selectedChatId);

      if (!job) {
        kanban.innerHTML = `<div class="kanban-empty">
          <div class="empty-icon">&#9670;</div>
          <div class="empty-text">${state.jobs.size === 0 ? 'Waiting for jobs' : 'Select a session'}</div>
          <div class="empty-hint">${state.jobs.size === 0 ? 'Type a message in the sidebar to get started' : ''}</div>
        </div>`;
        clearEdges();
        return;
      }

      const tasks = Object.values(job.tasks);
      const pending = tasks.filter(t => t.status === 'pending');
      const running = tasks.filter(t => t.status === 'running');
      const done = tasks.filter(t => t.status === 'done');

      // Job-level usage summary
      const jobTotals = getJobUsageTotals(state.selectedChatId);
      const usageBar = document.querySelector('.job-usage-bar');
      if (usageBar) usageBar.remove();
      if (jobTotals) {
        const bar = document.createElement('div');
        bar.className = 'job-usage-bar';
        bar.innerHTML = `<span>IN <span class="val">${fmtTokens(jobTotals.input_tokens)}</span></span>`
          + `<span>OUT <span class="val">${fmtTokens(jobTotals.output_tokens)}</span></span>`
          + `<span>TOTAL <span class="val">${fmtTokens(jobTotals.input_tokens + jobTotals.output_tokens)}</span></span>`
          + `<span>COST <span class="val" style="color:var(--accent-amber)">$${jobTotals.cost_usd.toFixed(4)}</span></span>`;
        kanban.parentElement.insertBefore(bar, kanban);
      }

      const stopAllBtn = running.length > 0
        ? `<button class="stop-all-btn" onclick="publishCancelAll('${esc(state.selectedChatId)}')">STOP ALL</button>`
        : '';

      kanban.innerHTML = `
        <div class="kanban-column">
          <div class="column-header"><span class="column-dot pending"></span><h3>PENDING</h3><span class="column-count">${pending.length}</span></div>
          <div class="column-body">${pending.map(t => renderCard(t, job)).join('')}</div>
        </div>
        <div class="kanban-column">
          <div class="column-header"><span class="column-dot running"></span><h3>RUNNING</h3><span class="column-count">${running.length}</span>${stopAllBtn}</div>
          <div class="column-body">${running.map(t => renderCard(t, job)).join('')}</div>
        </div>
        <div class="kanban-column">
          <div class="column-header"><span class="column-dot done"></span><h3>DONE</h3><span class="column-count">${done.length}</span></div>
          <div class="column-body">${done.map(t => renderCard(t, job)).join('')}</div>
        </div>
      `;

      kanban.querySelectorAll('.task-card').forEach(card => {
        card.addEventListener('click', () => {
          state.selectedTaskId = card.dataset.logicalId;
          renderKanbanSelection();
          renderDetail();
        });
      });

      renderKanbanSelection();
      scheduleEdgeDraw();
    }

    function renderCard(task, job) {
      const chatId = job.chat_id;
      let statusClass = 'status-' + task.status;
      const selected = task.logical_id === state.selectedTaskId;

      // Worker status for running tasks
      let workerDot = '';
      let streamIndicator = '';
      let streamPreview = '';
      if (task.status === 'running') {
        const ws = state.workerStatus.get(`${chatId}/${task.task_id}`);
        if (ws === 'alive') workerDot = '<span class="worker-dot alive"></span>';
        else if (ws === 'dead') workerDot = '<span class="worker-dot dead"></span>';
        else if (ws === 'done') workerDot = '<span class="worker-dot wdone"></span>';

        // Streaming indicator
        const hasChunks = state.streamChunks.has(`${chatId}/${task.task_id}`);
        if (hasChunks) {
          streamIndicator = '<span class="stream-dot"></span>';
          const lastText = getLatestStreamText(chatId, task);
          if (lastText) {
            streamPreview = `<div class="card-stream-preview">${esc(truncate(lastText, 60))}</div>`;
          }
        }
      }

      const desc = truncate(task.description, 100);

      const usage = getUsageForTask(chatId, task);
      let footerHtml = '<div class="card-footer">';
      if (usage && usage.usage) {
        const total = (usage.usage.input_tokens || 0) + (usage.usage.output_tokens || 0);
        footerHtml += `<span class="card-tokens">${fmtTokens(total)} tok</span>`;
      }
      if (usage && usage.cost_usd != null) {
        footerHtml += `<span class="card-cost">$${usage.cost_usd.toFixed(4)}</span>`;
      }
      if (task.status === 'running') {
        footerHtml += `<button class="stop-btn" data-task-id="${esc(task.task_id)}" data-chat-id="${esc(chatId)}" onclick="event.stopPropagation(); publishCancel('${esc(chatId)}','${esc(task.task_id)}','User stopped task')">STOP</button>`;
      }
      footerHtml += '</div>';

      return `<div class="task-card ${statusClass}${selected ? ' selected' : ''}" data-logical-id="${esc(task.logical_id)}">
        <div class="card-top">
          <span class="card-logical-id">${streamIndicator}${esc(task.logical_id)}</span>
          ${task.model ? `<span class="card-model">${esc(task.model)}</span>` : ''}
        </div>
        <div class="card-agent">${workerDot}${esc(task.agent)}</div>
        <div class="card-desc">${esc(desc)}</div>
        ${streamPreview}
        ${footerHtml}
      </div>`;
    }

    function renderKanbanSelection() {
      document.querySelectorAll('.task-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.logicalId === state.selectedTaskId);
      });
    }

    /* ═══════════════════════════════════════════
       Render — DAG Edges
       ═══════════════════════════════════════════ */
    let edgeDrawPending = false;
    function scheduleEdgeDraw() {
      if (!edgeDrawPending) {
        edgeDrawPending = true;
        requestAnimationFrame(() => { drawEdges(); edgeDrawPending = false; });
      }
    }

    function clearEdges() {
      const svg = document.getElementById('dag-svg');
      svg.innerHTML = '';
    }

    function drawEdges() {
      const svg = document.getElementById('dag-svg');
      const container = document.getElementById('kanban-wrapper');
      svg.innerHTML = '';

      const job = state.jobs.get(state.selectedChatId);
      if (!job) return;

      const containerRect = container.getBoundingClientRect();
      svg.setAttribute('width', container.scrollWidth);
      svg.setAttribute('height', container.scrollHeight);
      svg.style.width = container.scrollWidth + 'px';
      svg.style.height = container.scrollHeight + 'px';

      // Arrowhead marker
      const defs = document.createElementNS(SVG_NS, 'defs');
      const marker = document.createElementNS(SVG_NS, 'marker');
      marker.setAttribute('id', 'arrow');
      marker.setAttribute('markerWidth', '7');
      marker.setAttribute('markerHeight', '5');
      marker.setAttribute('refX', '7');
      marker.setAttribute('refY', '2.5');
      marker.setAttribute('orient', 'auto');
      const poly = document.createElementNS(SVG_NS, 'polygon');
      poly.setAttribute('points', '0 0, 7 2.5, 0 5');
      poly.setAttribute('fill', 'rgba(100, 116, 139, 0.45)');
      marker.appendChild(poly);
      defs.appendChild(marker);
      svg.appendChild(defs);

      for (const [logicalId, task] of Object.entries(job.tasks)) {
        for (const depId of (task.depends_on || [])) {
          const srcEl = document.querySelector(`.task-card[data-logical-id="${CSS.escape(depId)}"]`);
          const tgtEl = document.querySelector(`.task-card[data-logical-id="${CSS.escape(logicalId)}"]`);
          if (!srcEl || !tgtEl) continue;

          const srcRect = srcEl.getBoundingClientRect();
          const tgtRect = tgtEl.getBoundingClientRect();

          const x1 = srcRect.right - containerRect.left + container.scrollLeft;
          const y1 = srcRect.top + srcRect.height / 2 - containerRect.top + container.scrollTop;
          const x2 = tgtRect.left - containerRect.left + container.scrollLeft;
          const y2 = tgtRect.top + tgtRect.height / 2 - containerRect.top + container.scrollTop;

          const path = document.createElementNS(SVG_NS, 'path');

          if (x2 - x1 < 20) {
            // Same or nearby column — route around
            const offset = 50;
            const midX = Math.max(x1, x2) + offset;
            path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
          } else {
            const dx = (x2 - x1) * 0.4;
            path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
          }

          path.setAttribute('stroke', 'rgba(100, 116, 139, 0.3)');
          path.setAttribute('stroke-width', '1.5');
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke-dasharray', '4 3');
          path.setAttribute('marker-end', 'url(#arrow)');
          svg.appendChild(path);
        }
      }
    }

    /* ═══════════════════════════════════════════
       Render — Detail Panel
       ═══════════════════════════════════════════ */
    function renderDetail() {
      const panel = document.getElementById('detail-panel');
      const inner = document.getElementById('detail-inner');
      const job = state.jobs.get(state.selectedChatId);

      if (!job || !state.selectedTaskId) {
        panel.classList.add('hidden');
        return;
      }

      const task = job.tasks[state.selectedTaskId];
      if (!task) {
        panel.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');
      const result = getResultForTask(state.selectedChatId, task);

      let statusClass = 'status-' + task.status;

      const stopBtn = task.status === 'running'
        ? `<button class="stop-btn" onclick="publishCancel('${esc(state.selectedChatId)}','${esc(task.task_id)}','User stopped task')">STOP TASK</button>`
        : '';

      let html = `<div class="detail-header">
        <h2>${esc(task.logical_id)}</h2>
        <span class="detail-badge agent">${esc(task.agent)}</span>
        ${task.model ? `<span class="detail-badge model">${esc(task.model)}</span>` : ''}
        <span class="detail-badge ${statusClass}">${esc(task.status)}</span>
        ${stopBtn}
        <button class="detail-close" onclick="closeDetail()">&times; close</button>
      </div>`;

      // Description
      html += `<div class="detail-section">
        <div class="detail-section-label">Description</div>
        <div class="detail-text">${esc(task.description)}</div>
      </div>`;

      // Live streaming output (for running tasks)
      const streamKey = `${state.selectedChatId}/${task.task_id}`;
      const chunks = state.streamChunks.get(streamKey);
      if (task.status === 'running' && chunks) {
        html += `<div class="detail-section">
          <div class="detail-section-label"><span class="stream-dot"></span> Live Output</div>`;

        if (chunks && chunks.length > 0) {
          let streamHtml = '';
          // Show last 50 chunks
          const recent = chunks.slice(-50);
          for (const c of recent) {
            if (c.type === 'text') {
              streamHtml += esc(c.content);
            } else if (c.type === 'tool_use') {
              streamHtml += `<span class="chunk-tool">[${esc(c.content)}]</span>\n`;
            } else if (c.type === 'tool_result') {
              streamHtml += `<span class="chunk-tool">  → ${esc(truncate(c.content, 150))}</span>\n`;
            } else if (c.type === 'error') {
              streamHtml += `<span class="chunk-error">[ERROR: ${esc(c.content)}]</span>\n`;
            }
          }
          html += `<div class="detail-stream-output">${streamHtml}</div>`;
        }

        html += `</div>`;
      }

      // Result
      if (result) {
        html += `<div class="detail-section">
          <div class="detail-section-label">Result</div>
          <div class="detail-result-box"><div class="detail-text">${esc(result)}</div></div>
        </div>`;
      }

      // Dependencies
      if (task.depends_on && task.depends_on.length > 0) {
        html += `<div class="detail-section">
          <div class="detail-section-label">Dependencies</div>
          <div class="detail-deps">${task.depends_on.map(d =>
            `<span class="detail-dep-tag" data-dep="${esc(d)}">${esc(d)}</span>`
          ).join('')}</div>
        </div>`;
      }

      // Usage
      const usage = getUsageForTask(state.selectedChatId, task);
      if (usage && usage.usage) {
        const u = usage.usage;
        html += `<div class="detail-section">
          <div class="detail-section-label">Token Usage</div>
          <div class="detail-usage">
            <div class="usage-stat"><div class="stat-label">Input</div><div class="stat-value">${fmtTokens(u.input_tokens)}</div></div>
            <div class="usage-stat"><div class="stat-label">Output</div><div class="stat-value">${fmtTokens(u.output_tokens)}</div></div>
            <div class="usage-stat"><div class="stat-label">Cache Read</div><div class="stat-value">${fmtTokens(u.cache_read_input_tokens)}</div></div>
            <div class="usage-stat"><div class="stat-label">Cache Write</div><div class="stat-value">${fmtTokens(u.cache_creation_input_tokens)}</div></div>
            ${usage.cost_usd != null ? `<div class="usage-stat"><div class="stat-label">Cost</div><div class="stat-value cost">$${usage.cost_usd.toFixed(4)}</div></div>` : ''}
          </div>
        </div>`;
      }

      // Meta
      html += `<div class="detail-section">
        <div class="detail-meta">
          <span>task_id: ${esc(task.task_id)}</span>
          <span>max_turns: ${task.max_turns}</span>
        </div>
      </div>`;

      inner.innerHTML = html;

      // Wire up dependency tag clicks
      inner.querySelectorAll('.detail-dep-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          state.selectedTaskId = tag.dataset.dep;
          renderKanbanSelection();
          renderDetail();
        });
      });
    }

    function closeDetail() {
      state.selectedTaskId = null;
      document.getElementById('detail-panel').classList.add('hidden');
      renderKanbanSelection();
    }

    /* ═══════════════════════════════════════════
       Render — All
       ═══════════════════════════════════════════ */
    function renderAll() {
      renderSessionList();
      renderChatPanel();
      renderKanban();
      renderDetail();
    }

    /* ═══════════════════════════════════════════
       Compose — Submit Requests
       ═══════════════════════════════════════════ */
    function generateChatId() {
      return 'dash-' + crypto.randomUUID().slice(0, 8);
    }

    function sendMessage(text) {
      text = text.trim();
      if (!text || !mqttClient || !state.connected) return;

      let agentId = '';
      let pipelineId = '';
      let pipelineVars = {};

      // Slash commands override dropdown
      if (text.startsWith('/agent ')) {
        const parts = text.split(/\s+/, 2);
        agentId = parts[1] || '';
        text = text.slice(('/agent ' + agentId).length).trim();
        if (!agentId || !text) return;
      } else if (text.startsWith('/pipeline ')) {
        const parts = text.split(/\s+/);
        pipelineId = parts[1] || '';
        for (let i = 2; i < parts.length; i++) {
          if (parts[i] === '--var' && i + 1 < parts.length) {
            const kv = parts[++i];
            const eq = kv.indexOf('=');
            if (eq > 0) pipelineVars[kv.slice(0, eq)] = kv.slice(eq + 1);
          }
        }
        if (!pipelineId) return;
        if (!text) text = `Pipeline '${pipelineId}'`;
      } else {
        // Use dropdown selection
        const target = document.getElementById('compose-target').value;
        if (target.startsWith('agent:')) agentId = target.slice(6);
        else if (target.startsWith('pipeline:')) pipelineId = target.slice(9);
      }

      if (!agentId && !pipelineId) return;

      // Reuse active session's chat_id, or generate new
      let chatId = null;
      if (state.selectedChatId) {
        const job = state.jobs.get(state.selectedChatId);
        if (job && jobIsActive(job)) {
          chatId = state.selectedChatId;
        }
      }
      if (!chatId) chatId = generateChatId();

      const org = 'skitter', unit = 'default';
      const sessionId = crypto.randomUUID().slice(0, 8);
      const replyTopic = `$a2a/v1/reply/${org}/${unit}/dashboard/${sessionId}`;
      const msg = {
        text,
        sender: 'dashboard',
        chat_id: chatId,
        timestamp: Date.now() / 1000,
      };
      if (agentId) msg.agent_id = agentId;
      if (pipelineId) {
        msg.pipeline_id = pipelineId;
        msg.pipeline_vars = pipelineVars;
      }

      mqttClient.publish(`$a2a/v1/request/${org}/${unit}/coordinator`, JSON.stringify(msg), {
        qos: 1,
        properties: {
          responseTopic: replyTopic,
          correlationData: Buffer.from(chatId),
        },
      });

      // Select this session and clear input
      state.selectedChatId = chatId;
      document.getElementById('compose-input').value = '';
      renderAll();
    }

    function renderComposeSelector() {
      const sel = document.getElementById('compose-target');
      const prev = sel.value;
      sel.innerHTML = '';
      // Agents
      for (const [id, card] of state.agentCards) {
        const opt = document.createElement('option');
        opt.value = `agent:${id}`;
        opt.textContent = `agent: ${id}` + (card.name ? ` — ${card.name}` : '');
        sel.appendChild(opt);
      }
      // Restore previous selection if still valid
      if (prev && sel.querySelector(`option[value="${prev}"]`)) {
        sel.value = prev;
      }
    }

    function updateComposeState() {
      const bar = document.getElementById('compose-bar');
      bar.classList.toggle('disabled', !state.connected);
    }

    // Wire up compose UI
    document.getElementById('compose-send').addEventListener('click', () => {
      sendMessage(document.getElementById('compose-input').value);
    });

    document.getElementById('compose-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(e.target.value);
      }
    });

    document.getElementById('new-session-btn').addEventListener('click', () => {
      state.selectedChatId = null;
      state.selectedTaskId = null;
      document.getElementById('compose-input').focus();
      renderAll();
    });

    /* ═══════════════════════════════════════════
       Init
       ═══════════════════════════════════════════ */
    renderClock();
    setInterval(renderClock, 1000);
    renderAll();
    connect();

    window.addEventListener('resize', scheduleEdgeDraw);
  </script>
</body>
</html>
